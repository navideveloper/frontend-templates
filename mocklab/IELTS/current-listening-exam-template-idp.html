<!DOCTYPE html>

<meta charset="UTF-8">

<title>IELTS Listening — Test template</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
/* ============================================================
   IELTS test player — toza shablon (fjord theme)
   Ranglar asl CSS o'zgaruvchilaridan olingan.
   ============================================================ */
:root{
  --ielts-red:#e31837;
  --ink:#000;
  --text:#333;
  --muted:#535353;

  --rubric-bg:#f1f2ec;          /* --rubric-block--background */
  --rubric-border:#d5d5d5;

  --input-border:#535353;       /* --question--input-border */
  --input-focus:#418ec8;

  --nav-bg:#4c4c4c;             /* --footer-nav--background */
  --nav-bg-hover:#434343;
  --nav-next-bg:#000;           /* --footer-nav--next-background */
  --nav-next-hover:#262626;
  --nav-disabled:#d6d6d6;

  --seg-line:#d7d7d7;           /* --footer--selected-border */
  --attempted:#358e14;          /* --footer--subquestion-attempted-bg */
  --active-border:#418fc6;      /* --footer--subquestion-active-border */
  --deliver-bg:#efefef;
  --deliver-hover:#262626;

  --fs:16px;
  --font:Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); font-size:var(--fs); color:var(--ink);
  background:#fff; line-height:1.5;
}
p,li{line-height:1em}
li::marker {
    font-size: 14px;
}
button{font-family:inherit; font-size:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:1px solid var(--input-focus); outline-offset:0px}
.app{display:flex; flex-direction:column; height:100vh}

/* ---------------- HEADER ---------------- */
.hdr{display:flex; align-items:center; min-height:57px; background:#fff; border-bottom:1px solid #e6e6e6; flex:none}
.hdr__logo{padding:0 1em}
.hdr__logo svg{height:26px; width:auto; display:block}
.hdr__info{display:flex; flex-direction:column; justify-content:center; row-gap:.2em; padding:.5em 2em .5em 1em; min-width:0}
.hdr__id{font-weight:600; font-size:.95em; line-height:1.2}
.hdr__status{display:inline-flex; align-items:center; gap:.45em; font-size:.85em; line-height:1.2}
.hdr__spacer{flex:1}
.hdr__tools{display:flex;gap:0; align-items:stretch; align-self:stretch}
.iconbtn{border:0; background:transparent; padding:0 13px; cursor:pointer; color:var(--text); display:inline-flex; align-items:center}
.iconbtn:hover:not(:disabled){background:rgba(0,0,0,.05)}
.iconbtn:disabled{color:#a9a9a9; cursor:default}
.icon{width:30px; height:30px; fill:currentColor; display:block}
.icon.sm{width:15px; height:15px}
.timer{display:inline-flex; align-items:center; gap:.4em; font-size:.85em; color:var(--text); white-space:nowrap; padding-right:1em}
.timer[hidden]{display:none}
.timer.warn{color:var(--ielts-red); font-weight:bold}

/* ---------------- OPTIONS ---------------- */
.menu{position:absolute; right:.75em; top:57px; z-index:60; background:#fff; min-width:250px;
      border:1px solid var(--rubric-border); border-radius:4px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:.5em}
.menu[hidden]{display:none}
.menu__row{display:flex; align-items:center; justify-content:space-between; gap:.75em; padding:.55em .4em; font-size:.9em}
.menu__row+.menu__row{border-top:1px solid #eee}
.seg{display:flex; border:1px solid var(--rubric-border); border-radius:3px; overflow:hidden}
.seg button{border:0; background:#fff; padding:.35em .7em; cursor:pointer; font-size:.85em; color:var(--text)}
.seg button+button{border-left:1px solid var(--rubric-border)}
.seg button[aria-pressed="true"]{background:#333; color:#fff}

/* ---------------- KONTENT ---------------- */
.main{flex:1; overflow-y:auto;padding-top: 1em}
.rubric{margin:1em; border:1px solid var(--rubric-border); border-radius:4px; padding:.75em 1em; background:var(--rubric-bg)}
.rubric h2{font-size:1rem; margin:0 0 .25em}
.rubric p{margin:0}
.wrap{padding:0 1em 4em}
.group+.group{margin-top:2em}
.group__head{font-size:1rem; margin:1em 0 .25em}
.group__rubric{margin:0 0 1em}
.group__rubric p{margin:.25em 0}

.b-title{font-size:1.15rem; margin:.4em 0 .4em; text-align:left}
.b-sub{font-size:1rem; margin:1.2em 0 .3em}
.b-p{margin:.6em 0}
.b-box{border:1px solid #000; padding:.75em; font-weight:bold; font-style:italic; margin:1em 0}
.b-img{display:block; max-width:100%; margin:1em auto}
ul.b-list{list-style-type:"●"; padding-left:32px; margin:.5em 0}
ul.b-list ul{list-style-type:"–"; margin:.3em 0}
ul.b-list li{padding-left:1.25rem; margin:.35em 0}
table.b-table{border-collapse:collapse; margin:1em 0; width:100%}
table.b-table th,table.b-table td{border:1px solid #000; padding:.5em .7em; text-align:left; vertical-align:top}
table.b-table th{background:#f2f2f2}

/* Javob maydonlari */
.gap{
  font-family:inherit; font-size:1em; height:1.5rem;width:173px; min-width:173px; max-width:100%;
  padding:0 .5em; margin:.05em .25em -0.1em; border:1px solid var(--input-border); border-radius:3px;
  background:#fff; color:#000; vertical-align:middle;
}
.gap:focus{border-color:var(--input-focus)}
.gap::placeholder{color:#000; font-weight:bold; text-align:center; opacity:1}
.gap.filled::placeholder{opacity:0}

.opts{list-style:none; margin:.5em 0 0; padding:0}
.opts label{display:flex; gap:.6em; align-items:flex-start; padding:.6rem .5rem; cursor:pointer}
.opts label:hover{background:rgba(0,0,0,.04)}
.opts input{margin:.3em 0 0; flex:none; width:16px; height:16px; accent-color:#333}
.opts .key{font-weight:bold; flex:none; min-width:1.2em}
.qtext{font-weight:bold; margin:1.2em 0 0}
.qnum{display:inline-block; min-width:1.9em; height:1.9em; line-height:1.9em; text-align:center;
      background:#333; color:#fff; border-radius:3px; font-weight:bold; margin-right:.5em; font-size:.85em}
.limit{font-size:.85em; color:var(--muted); font-style:italic; margin:.3em 0 0}
.match-item{display:flex; align-items:center; gap:.6em; margin:.5em 0}
.match-item select{font-family:inherit; font-size:1em; height:2.2em; padding:0 .4em; min-width:64px;
                   border:1px solid var(--input-border); border-radius:3px; background:#fff}
.match-opts{border:1px solid #000; padding:.75em 1em; margin:1em 0; max-width:520px}
.match-opts dt{float:left; font-weight:bold; width:1.6em}
.match-opts dd{margin:0 0 .4em 1.6em}

/* ---------------- FOOTER ---------------- */
.ftr{flex:none; position:relative; background:#fff; border-top:1px solid #e6e6e6}
.navbtns{position:absolute; right:2rem; bottom:calc(100% + 1.5rem); display:flex; gap:.5rem; z-index:30}
.navbtns button{border:0; border-radius:3px; color:#fff; cursor:pointer; width:56px; height:44px;
                display:flex; align-items:center; justify-content:center; background:var(--nav-bg)}
.navbtns .prev:hover:not(:disabled){background:var(--nav-bg-hover)}
.navbtns .next:not(:disabled){background:var(--nav-next-bg)}
.navbtns .next:hover:not(:disabled){background:var(--nav-next-hover)}
.navbtns button:disabled{background:var(--nav-disabled); cursor:default}
.navbtns .icon{width:24px; height:24px}

.navrow{display:flex; align-items:stretch; min-height:56px}
.parts{display:flex; align-items:stretch; flex:1; overflow-x:auto}
.part{display:flex; align-items:center; padding:0 .5em}
.part__tab,.qbtn{
  position:relative; border:2px solid transparent; background:transparent; color:var(--text);
  margin-top:.6em; padding:calc(.4em - 2px) .5em; border-radius:3px; cursor:pointer; white-space:nowrap;
}
.part__tab::before,.qbtn::before{
  content:""; position:absolute; left:0; top:calc(-0.6em - 7px); width:calc(100% + 1px); height:3px;
  background:var(--seg-line); transition:background .15s linear;
}
.part.current .part__tab{font-weight:bold}
.qbtn{min-width:30px; padding:calc(.4em - 2px) 2px}
.part:not(.current) .part__nums{display:none}
.part__nums{display:flex; align-items:center; gap:2px; padding-left:.4em}
.qbtn.attempted::before{background:var(--attempted)}
.qbtn:hover{border-color:var(--active-border); font-weight:bold}
.qbtn.active{border:2px solid var(--active-border); font-weight:bold}
.review-btn{border:0; border-left:1px solid #e6e6e6; background:var(--deliver-bg); color:var(--muted);
            min-width:6rem; padding:0 1rem; cursor:pointer; display:flex; align-items:center; justify-content:center}
.review-btn:hover{background:#c3d8ec}
.review-btn.complete{background:#333; color:#fff}
.review-btn.complete:hover{background:var(--deliver-hover)}

/* ---------------- Review / natija ---------------- */
.sheet{max-width:820px; margin:0 auto; padding:1.5em 1em}
.sheet h2{margin:0 0 .2em; font-size:1.25rem}
.sheet .lead{color:var(--muted); margin:0 0 1.2em; font-size:.95rem}
table.answers{border-collapse:collapse; width:100%}
table.answers th,table.answers td{border-bottom:1px solid #e6e6e6; padding:.55em .6em; text-align:left; font-size:.95rem}
table.answers th{font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
table.answers td.n{width:56px; font-weight:bold}
.blank{color:var(--muted); font-style:italic}
.mark{font-weight:bold}
.mark.ok{color:var(--attempted)}
.mark.bad{color:var(--ielts-red)}
.jump{background:none; border:0; color:#2a6c96; cursor:pointer; text-decoration:underline; padding:0; font-size:inherit}
.actions{display:flex; gap:.6em; flex-wrap:wrap; margin-top:1.4em}
.btn{border:1px solid #000; background:#000; color:#fff; padding:.6em 1.1em; border-radius:3px; cursor:pointer; font-size:.95rem}
.btn:hover{background:var(--nav-next-hover); border-color:var(--nav-next-hover)}
.btn.ghost{background:#fff; color:#000}
.btn.ghost:hover{background:#f0f0f0; color:#000}
.score{display:flex; gap:2em; flex-wrap:wrap; align-items:baseline; border:1px solid var(--rubric-border);
       background:var(--rubric-bg); border-radius:4px; padding:1em 1.2em; margin-bottom:1.2em}
.score b{font-size:2rem}
.score span{display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
::-webkit-scrollbar {

  width: 20px; /* Width of the scrollbar */
}

::-webkit-scrollbar-track {
  background: #f1f1f1; /* Track background color */
}

::-webkit-scrollbar-thumb {
  background: #888; /* Thumb color */
  border-radius: 0; /* Rounded corners */
}

::-webkit-scrollbar-thumb:hover {
  background: #555; /* Thumb color on hover */
}
@media (max-width:720px){
  :root{--fs:15px}
  .hdr__logo{padding:0 .6em}
  .hdr__info{padding:.5em .6em}
  .navbtns{right:1rem}
  .gap{min-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============================================================
   1-QISM — KONTENT. Faqat shu blokni tahrirlang.
   ------------------------------------------------------------
   Bo'sh joy:  {{7}}  ->  7-savol uchun input
   Matn ichida HTML ishlaydi: <strong>, <em>, <br>

   Blok turlari:
     {t:'title', text}                            sarlavha (chapga tekis)
     {t:'sub',   text}                            kichik sarlavha
     {t:'p',     text}                            paragraf
     {t:'box',   text}                            ramkali izoh
     {t:'img',   src, alt}                        rasm / xarita
     {t:'list',  items:[ 'matn', {text, sub:[]} ]}
     {t:'table', head:[...], rows:[[...],[...]]}
     {t:'mcq',   q, text, options:[...]}          bitta javob
     {t:'multi', qs:[9,10], text, options:[...]}  ikki javob
     {t:'match', text, options:[...], items:[{q, text}]}
   ============================================================ */

const EXAM = {
  taker: "Sharobidinov Qudratillo",
  duration: 30,        // daqiqa
  showTimer: false,    // true -> header'da taymer ko'rinadi
  audio: "",           // "audio/part1.mp3" — bo'sh bo'lsa tugma o'chadi
  parts: [
    {
      title: "Part 1",
      instructions: "Listen and answer questions 1–7.",
      groups: [
        {
          heading: "Questions 1–7",
          rubric: "Complete the notes. Write <strong>ONE WORD AND/OR A NUMBER</strong> for each answer.",
          blocks: [
            {t:'title', text:"Phone call about second-hand furniture"},
            {t:'title', text:"Items"},
            {t:'sub',   text:"Dining table"},
            {t:'list',  items:["{{1}} shape", "medium size", "{{2}} old", "£25.00"]},
            {t:'sub',   text:"Dining chairs"},
            {t:'list',  items:["set of {{3}} chairs", "seats covered in {{4}} material", "in {{5}} condition", "£20.00"]},
            {t:'sub',   text:"Desk"},
            {t:'list',  items:["length: {{6}}", "3 drawers. Top drawer has a {{7}}", "£50.00"]}
          ]
        }
      ]
    },
    {
      title: "Part 2",
      instructions: "Listen and answer questions 8–14.",
      groups: [
        {
          heading: "Questions 8–10",
          rubric: "Choose the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.",
          blocks: [
            {t:'mcq', q:8, text:"The speaker says the new centre is mainly used by",
             options:["local schools.", "sports clubs.", "families."]},
            {t:'mcq', q:9, text:"Members can book a court",
             options:["online only.", "by phone or online.", "in person only."]},
            {t:'mcq', q:10, text:"The café is closed on",
             options:["Mondays.", "Saturdays.", "Sundays."]}
          ]
        },
        {
          heading: "Questions 11 and 12",
          rubric: "Choose <strong>TWO</strong> letters, <strong>A–E</strong>.",
          blocks: [
            {t:'multi', qs:[11,12], text:"Which TWO facilities are new this year?",
             options:["swimming pool", "climbing wall", "car park", "gym", "tennis courts"]}
          ]
        },
        {
          heading: "Questions 13 and 14",
          rubric: "What comment does the speaker make about each area? Choose your answers from the box.",
          blocks: [
            {t:'match',
             options:["It has been extended.", "It is rarely used.", "It will be closed for repairs."],
             items:[{q:13, text:"Main hall"}, {q:14, text:"Studio 2"}]}
          ]
        }
      ]
    },
    {
      title: "Part 3",
      instructions: "Listen and answer questions 15–18.",
      groups: [
        {
          heading: "Questions 15–18",
          rubric: "Complete the table. Write <strong>NO MORE THAN TWO WORDS</strong> for each answer.",
          blocks: [
            {t:'table',
             head:["Stage", "Focus", "Problem"],
             rows:[
               ["Planning", "choosing a {{15}}",       "took too long"],
               ["Research", "reading {{16}} articles", "hard to find"],
               ["Writing",  "the {{17}} section",      "not enough data"],
               ["Review",   "checking {{18}}",         "ran out of time"]
             ]}
          ]
        }
      ]
    }
  ]
};

/* Javoblar kaliti — bo'sh qoldirilsa tekshiruv o'chadi. */
const ANSWER_KEY = {
  1:["round"], 2:["50 years","fifty years"], 3:["6","six"], 4:["cotton"],
  5:["good"], 6:["1.5 metres","1.5 m","1.5 meters"], 7:["lock"],
  8:["A"], 9:["B"], 10:["C"], 11:["B","D"], 12:["B","D"],
  13:["A"], 14:["C"],
  15:["topic"], 16:["academic"], 17:["results"], 18:["references"]
};

/* ============================================================
   2-QISM — DVIGATEL
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const state = { part:0, answers:{}, multi:{}, finished:false, left:EXAM.duration*60 };

const GAP_RE = /\{\{(\d+)\}\}/g;
function scanText(str,out){ let m; GAP_RE.lastIndex=0; while((m=GAP_RE.exec(String(str)))) out.push(+m[1]); }
function partQuestions(part){
  const out=[];
  part.groups.forEach(g=>g.blocks.forEach(b=>{
    if(b.t==='mcq') out.push(b.q);
    else if(b.t==='multi') out.push(...b.qs);
    else if(b.t==='match') b.items.forEach(i=>out.push(i.q));
    else if(b.t==='list') b.items.forEach(i=>{
      const isObj = typeof i==='object' && i!==null;
      scanText(isObj?i.text:i, out);
      if(isObj && Array.isArray(i.sub)) i.sub.forEach(s=>scanText(s,out));
    });
    else if(b.t==='table'){ (b.head||[]).forEach(c=>scanText(c,out)); b.rows.forEach(r=>r.forEach(c=>scanText(c,out))); }
    else if(b.text) scanText(b.text,out);
  }));
  return [...new Set(out)].sort((a,b)=>a-b);
}
EXAM.parts.forEach(p=>p.questions = partQuestions(p));
const ALL_Q = EXAM.parts.flatMap(p=>p.questions);
const HAS_KEY = Object.keys(ANSWER_KEY).length > 0;

const LETTERS = "ABCDEFGHIJ";
function gaps(str){
  return String(str).replace(GAP_RE,(_,n)=>
    `<input class="gap" type="text" data-q="${n}" placeholder="${n}" aria-label="Insert answer ${n}" autocomplete="off" spellcheck="false" maxlength="60">`);
}
function renderBlock(b){
  switch(b.t){
    case 'title': return `<h3 class="b-title">${gaps(b.text)}</h3>`;
    case 'sub':   return `<h4 class="b-sub">${gaps(b.text)}</h4>`;
    case 'p':     return `<p class="b-p">${gaps(b.text)}</p>`;
    case 'box':   return `<div class="b-box">${gaps(b.text)}</div>`;
    case 'img':   return `<img class="b-img" src="${b.src}" alt="${b.alt||''}">`;
    case 'list':  return `<ul class="b-list">${b.items.map(i=>{
                    const isObj = typeof i==='object' && i!==null;
                    const t = isObj ? i.text : i;
                    const sub = (isObj && Array.isArray(i.sub)) ? `<ul>${i.sub.map(s=>`<li>${gaps(s)}</li>`).join('')}</ul>` : '';
                    return `<li>${gaps(t)}${sub}</li>`;
                  }).join('')}</ul>`;
    case 'table': return `<table class="b-table">${
                    b.head?`<thead><tr>${b.head.map(c=>`<th>${gaps(c)}</th>`).join('')}</tr></thead>`:''
                  }<tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${gaps(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'mcq':   return `<p class="qtext"><span class="qnum">${b.q}</span>${b.text}</p>
                  <ul class="opts">${b.options.map((o,i)=>`<li><label>
                    <input type="radio" name="q${b.q}" value="${LETTERS[i]}" data-q="${b.q}">
                    <span class="key">${LETTERS[i]}</span><span>${o}</span></label></li>`).join('')}</ul>`;
    case 'multi': return `<p class="qtext"><span class="qnum">${b.qs.join('&')}</span>${b.text}</p>
                  <ul class="opts" data-multi="${b.qs.join('-')}" data-max="${b.qs.length}">${b.options.map((o,i)=>`<li><label>
                    <input type="checkbox" value="${LETTERS[i]}">
                    <span class="key">${LETTERS[i]}</span><span>${o}</span></label></li>`).join('')}</ul>
                  <p class="limit">Choose ${b.qs.length} answers.</p>`;
    case 'match': return `${b.text?`<p class="b-p">${b.text}</p>`:''}
                  <dl class="match-opts">${b.options.map((o,i)=>`<dt>${LETTERS[i]}</dt><dd>${o}</dd>`).join('')}</dl>
                  ${b.items.map(it=>`<div class="match-item"><span class="qnum">${it.q}</span><span>${it.text}</span>
                    <select data-q="${it.q}" aria-label="Insert answer ${it.q}"><option value="">–</option>
                    ${b.options.map((_,i)=>`<option value="${LETTERS[i]}">${LETTERS[i]}</option>`).join('')}</select></div>`).join('')}`;
    default: return '';
  }
}
function renderPart(){
  const p = EXAM.parts[state.part];
  $('#rubricTitle').textContent = p.title;
  $('#rubricText').innerHTML = p.instructions || '';
  $('#rubric').hidden = false;
  $('#content').innerHTML = p.groups.map(g=>`<section class="group">
      <h3 class="group__head">${g.heading||''}</h3>
      <div class="group__rubric">${g.rubric||''}</div>
      ${g.blocks.map(renderBlock).join('')}
    </section>`).join('');
  restoreAnswers();
  $('#prevBtn').disabled = state.part===0;
  $('#nextBtn').disabled = state.part===EXAM.parts.length-1;
  buildFooter();
  $('#main').scrollTop = 0;
}
function restoreAnswers(){
  document.querySelectorAll('#content .gap').forEach(el=>{
    const v = state.answers[el.dataset.q] || '';
    el.value = v; el.classList.toggle('filled', !!v);
  });
  document.querySelectorAll('#content input[type=radio]').forEach(el=>{
    el.checked = state.answers[el.dataset.q] === el.value;
  });
  document.querySelectorAll('#content select[data-q]').forEach(el=>{
    el.value = state.answers[el.dataset.q] || '';
  });
  document.querySelectorAll('#content .opts[data-multi]').forEach(ul=>{
    const picked = state.multi[ul.dataset.multi] || [];
    ul.querySelectorAll('input').forEach(cb=> cb.checked = picked.includes(cb.value));
  });
}

function buildFooter(){
  $('#parts').innerHTML = EXAM.parts.map((p,i)=>`
    <div class="part ${i===state.part?'current':''}">
      <button class="part__tab" data-part="${i}">${p.title}</button>
      <div class="part__nums">${p.questions.map(q=>`
        <button class="qbtn ${isAttempted(q)?'attempted':''}" data-q="${q}">
          <span class="sr-only">Question </span>${q}</button>`).join('')}
      </div>
    </div>`).join('');
  $('#reviewBtn').classList.toggle('complete', ALL_Q.every(isAttempted));
}
function isAttempted(q){
  const v = state.answers[q];
  return v!==undefined && String(v).trim()!=='';
}
function refreshFooter(){
  document.querySelectorAll('.qbtn').forEach(b=> b.classList.toggle('attempted', isAttempted(+b.dataset.q)));
  $('#reviewBtn').classList.toggle('complete', ALL_Q.every(isAttempted));
}
function goToQuestion(q){
  const idx = EXAM.parts.findIndex(p=>p.questions.includes(q));
  const jump = ()=>{
    let el = document.querySelector(`#content [data-q="${q}"]`)
          || document.querySelector(`#content input[name="q${q}"]`);
    if(!el){
      const ul = [...document.querySelectorAll('#content .opts[data-multi]')]
        .find(u=>u.dataset.multi.split('-').includes(String(q)));
      el = ul && ul.querySelector('input');
    }
    if(!el) return;
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.focus({preventScroll:true});
    document.querySelectorAll('.qbtn').forEach(b=> b.classList.toggle('active', +b.dataset.q===q));
  };
  if(idx>=0 && idx!==state.part){ state.part=idx; renderPart(); setTimeout(jump,60); }
  else jump();
}

$('#content').addEventListener('input', e=>{
  const el = e.target;
  if(el.classList.contains('gap')){
    state.answers[el.dataset.q] = el.value;
    el.classList.toggle('filled', !!el.value.trim());
    refreshFooter();
  }
});
$('#content').addEventListener('focusin', e=>{
  const q = e.target.dataset && e.target.dataset.q;
  if(q) document.querySelectorAll('.qbtn').forEach(b=> b.classList.toggle('active', b.dataset.q===q));
});
$('#content').addEventListener('change', e=>{
  const el = e.target;
  if(el.type==='radio'){ state.answers[el.dataset.q] = el.value; refreshFooter(); }
  else if(el.tagName==='SELECT'){ state.answers[el.dataset.q] = el.value; refreshFooter(); }
  else if(el.type==='checkbox'){
    const ul = el.closest('.opts'); const max = +ul.dataset.max;
    const qs = ul.dataset.multi.split('-').map(Number);
    let picked = [...ul.querySelectorAll('input:checked')].map(i=>i.value);
    if(picked.length>max){ el.checked=false; picked = picked.filter(v=>v!==el.value); }
    state.multi[ul.dataset.multi] = picked;
    qs.forEach((q,i)=> state.answers[q] = picked[i] || '');
    refreshFooter();
  }
});

$('#parts').addEventListener('click', e=>{
  const tab = e.target.closest('.part__tab');
  const qb  = e.target.closest('.qbtn');
  if(tab){ state.part = +tab.dataset.part; renderPart(); }
  else if(qb){ goToQuestion(+qb.dataset.q); }
});
$('#prevBtn').onclick = ()=>{ if(state.part>0){ state.part--; renderPart(); } };
$('#nextBtn').onclick = ()=>{ if(state.part<EXAM.parts.length-1){ state.part++; renderPart(); } };

$('#reviewBtn').onclick = showReview;
function showReview(){
  $('#rubric').hidden = true;
  const rows = ALL_Q.map(q=>{
    const v = state.answers[q];
    return `<tr><td class="n">${q}</td>
      <td>${v && String(v).trim() ? escapeHtml(v) : '<span class="blank">Not answered</span>'}</td>
      <td><button class="jump" data-jump="${q}">Go to question</button></td></tr>`;
  }).join('');
  const left = ALL_Q.filter(q=>!isAttempted(q)).length;
  $('#content').innerHTML = `<div class="sheet">
      <h2>Review your answers</h2>
      <p class="lead">${left===0 ? 'All questions answered.' : left+' question(s) still blank.'}</p>
      <table class="answers"><thead><tr><th>Q</th><th>Your answer</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="actions">
        <button class="btn ghost" id="backBtn">Back to test</button>
        ${HAS_KEY?'<button class="btn" id="submitBtn">Submit and see score</button>':''}
      </div>
    </div>`;
  $('#main').scrollTop = 0;
  $('#backBtn').onclick = ()=> renderPart();
  const sb = $('#submitBtn'); if(sb) sb.onclick = showScore;
  $('#content').querySelectorAll('[data-jump]').forEach(b=> b.onclick = ()=> goToQuestion(+b.dataset.jump));
}

function norm(s){ return String(s||'').toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function isCorrect(q){
  const key = ANSWER_KEY[q]; if(!key) return null;
  const given = norm(state.answers[q]); if(!given) return false;
  return (Array.isArray(key)?key:[key]).some(k=> norm(k)===given);
}
function showScore(){
  state.finished = true; stopTimer(); pauseAudio();
  let correct = 0, scored = 0;
  const rows = ALL_Q.map(q=>{
    const res = isCorrect(q); const key = ANSWER_KEY[q];
    if(res!==null){ scored++; if(res) correct++; }
    return `<tr><td class="n">${q}</td>
      <td>${state.answers[q]&&String(state.answers[q]).trim()?escapeHtml(state.answers[q]):'<span class="blank">—</span>'}</td>
      <td>${key?escapeHtml((Array.isArray(key)?key:[key]).join(' / ')):'<span class="blank">—</span>'}</td>
      <td class="mark ${res?'ok':'bad'}">${res===null?'':(res?'✓':'✗')}</td></tr>`;
  }).join('');
  $('#rubric').hidden = true;
  $('#content').innerHTML = `<div class="sheet">
      <h2>Your result</h2>
      <div class="score">
        <div><b>${correct}/${scored}</b><span>Raw score</span></div>
        ${scored===40?`<div><b>${band(correct)}</b><span>Approx. band</span></div>`:''}
      </div>
      <table class="answers"><thead><tr><th>Q</th><th>Your answer</th><th>Accepted</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="actions"><button class="btn" id="againBtn">Start again</button></div>
    </div>`;
  $('#main').scrollTop = 0;
  $('#againBtn').onclick = restart;
}
function band(n){
  if(n>=39) return 9; if(n>=37) return 8.5; if(n>=35) return 8; if(n>=32) return 7.5;
  if(n>=30) return 7;  if(n>=26) return 6.5; if(n>=23) return 6; if(n>=18) return 5.5;
  if(n>=16) return 5;  if(n>=13) return 4.5; if(n>=10) return 4; if(n>=8) return 3.5;
  if(n>=6)  return 3;  return 2.5;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* --- taymer --- */
let tick = null;
function startTimer(){
  clearInterval(tick);
  tick = setInterval(()=>{
    state.left--; paintTimer();
    if(state.left<=0){ stopTimer(); pauseAudio(); HAS_KEY ? showScore() : showReview(); }
  },1000);
}
function stopTimer(){ clearInterval(tick); tick=null; }
function paintTimer(){
  const m = Math.max(0,Math.floor(state.left/60)), s = Math.max(0,state.left%60);
  $('#timerVal').textContent = `${m}:${String(s).padStart(2,'0')}`;
  $('#timer').classList.toggle('warn', state.left<=300);
}

/* --- audio --- */
const player = $('#player');
if(EXAM.audio){ player.src = EXAM.audio; }
else { $('#audioBtn').disabled = true; $('#audioBtn').style.opacity = .45; }
$('#audioBtn').onclick = ()=>{ player.paused ? player.play().catch(()=>{}) : player.pause(); };
player.onplay  = ()=>{ setAudio(true); if(!tick && !state.finished) startTimer(); };
player.onpause = ()=> setAudio(false);
player.onended = ()=> setAudio(false);
function pauseAudio(){ try{ player.pause(); }catch(e){} }
function setAudio(on){
  $('#audioStatus').textContent = on ? 'Audio is Playing' : 'Audio is not playing';
  $('#audioBtn').textContent = on ? 'Pause' : 'Play';
}

/* --- Options --- */
$('#optionsBtn').onclick = ()=>{
  const m = $('#optionsMenu'); m.hidden = !m.hidden;
  $('#optionsBtn').setAttribute('aria-expanded', String(!m.hidden));
};
document.addEventListener('click', e=>{
  if(!e.target.closest('#optionsMenu') && !e.target.closest('#optionsBtn')){
    $('#optionsMenu').hidden = true; $('#optionsBtn').setAttribute('aria-expanded','false');
  }
});
$('#sizeSeg').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.documentElement.style.setProperty('--fs', b.dataset.size+'px');
  [...e.currentTarget.children].forEach(x=> x.setAttribute('aria-pressed', String(x===b)));
};
$('#timerSeg').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  $('#timer').hidden = b.dataset.timer==='off';
  [...e.currentTarget.children].forEach(x=> x.setAttribute('aria-pressed', String(x===b)));
};


/* --- start --- */
$('#takerId').textContent = EXAM.taker || 'Test taker ID';
if(EXAM.showTimer){
  $('#timer').hidden = false;
  [...$('#timerSeg').children].forEach(x=> x.setAttribute('aria-pressed', String(x.dataset.timer==='on')));
}
paintTimer(); renderPart(); startTimer();
</script>
