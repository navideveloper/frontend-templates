     ========================================================= */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');

    switch (a) {
      case 'tab':
        if (ui.tab !== v) { ui.tab = v; ui.filter = 'all'; ui.q = ''; $('#q').value = ''; ui.sel = null; }
        syncTabs(); if (stack.length) back(stack.length); renderAll();
        $('#listScroll').scrollTop = 0;
        break;
      case 'open': selectClient(id); break;
      case 'back': back(); break;
      case 'close': back(); break;
      case 'voice': openVoice(); break;
      case 'add': openDebt({}); break;
      case 'add-named': openDebt({ name:ui.q }); break;
      case 'menu': openMenu(v); break;
      case 'set-filter': ui.filter = v; renderList(); if (stack[stack.length - 1] === 'lyMenu') back(); break;
      case 'set-sort': ui.sort = v; renderList(); back(); break;
      case 'settings': openSettings(); break;
      case 'undo':
        if (undoSnap) { db = JSON.parse(undoSnap); undoSnap = null; save(); renderAll(); toast('Qaytarildi'); }
        break;

      case 'v-start': vcStart(); break;
      case 'v-send': V.stop(); break;
      case 'v-resume': V.resume(); break;
      case 'v-cancel': V.cancel(); vcState('idle'); break;
      case 'v-manual': V.cancel(); openDebt({}, 'lyVoice'); break;
      case 'v-photo': $('#fileIn').click(); break;

      case 'debt': openDebt({ clientId:id, lock:true }); break;
      case 'pay': openPay(id); break;
      case 'edit': openClient(id); break;

      case 'f-save': saveDebt(); break;
      case 'f-voice': formVoice('f'); break;
      case 'f-cur': setCur('f', v); break;
      case 'f-due':
        $('#fDue').value = toISO(startOf(new Date()).getTime() + (+v) * DAY);
        $$('#fDueQ .chip').forEach(function(x){ x.classList.toggle('on', x === el); });
        break;
      case 'f-pick': bind(byId(id)); break;
      case 'f-unbind': F.clientId = null; renderMatch(); $('#fName').focus(); break;

      case 'p-save': savePay(); break;
      case 'p-voice': formVoice('p'); break;
      case 'p-cur': setCur('p', v); payLeft(); break;
      case 'p-quick':
        var owed = bal(byId(P.id))[P.cur];
        if (owed > 0) { $('#pSum').value = fmt(v === 'all' ? owed : Math.round(owed / 2)); payLeft(); }
        break;
      case 'p-date':
        P.date = v;
        $$('#pDateQ .chip').forEach(function(x){ x.classList.toggle('on', x === el); });
        $('#pDate').hidden = v !== 'other';
        break;
      case 'dictate': dictate(v, el); break;

      case 'c-save': saveClient(id); break;
      case 'c-del': delClient(id); break;
      case 'rec-menu':
        var rc = byId(id), rid = el.getAttribute('data-rid');
        openActions('Yozuv', [{ label:"O'chirish", icon:IC.trash, danger:true, fn:function(){
          var s = snap();
          rc.recs = rc.recs.filter(function(r){ return r.id !== rid; });
          save(); back(); renderAll(); toast("Yozuv o'chirildi", s);
        } }]);
        break;
      case 'act': if (ACTS[+v]) ACTS[+v].fn(); break;

      case 's-lang':
        db.settings.lang = v; save();
        $$('#lySettings .seg button').forEach(function(x){ x.classList.toggle('on', x === el); });
        break;
      case 's-demo': var s1 = snap(); db = seed(); save(); ui.sel = null; back(); renderAll(); toast("Namuna ma'lumotlar yuklandi", s1); break;
      case 's-clear': var s2 = snap(); db.clients = []; save(); ui.sel = null; back(); renderAll(); toast("Hammasi o'chirildi", s2); break;
    }
  });

  $('#backdrop').addEventListener('click', function(){ back(); });
  $('#q').addEventListener('input', function(){ ui.q = this.value; renderList(); });
  $('#fileIn').addEventListener('change', function(){
    if (this.files && this.files[0]) toast("Surat qabul qilindi. Daftardan o'qish keyingi bosqichda ulanadi.");
    this.value = '';
  });

  document.addEventListener('keydown', function(e){
    var typing = /input|textarea|select/i.test(e.target.tagName);
    if (e.key === 'Escape') {
      if (stack.length) { e.preventDefault(); back(); }
      return;
    }
    if (typing) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (stack[stack.length - 1] === 'lyVoice') { if (V.paused()) V.resume(); else if (V.active()) V.stop(); else vcStart(); }
      else if (!stack.length || (stack.length === 1 && stack[0] === 'detail')) openVoice();
    }
    if (e.key === '/' && !stack.length) { e.preventDefault(); $('#q').focus(); }
  });

  /* ekran o'lchami o'zgarsa (telefonni burish, oynani kattalashtirish) */
  var lastDesk = isDesk();
  window.addEventListener('resize', function(){
    var dsk = isDesk();
    if (dsk === lastDesk) return;
    lastDesk = dsk;
    if (dsk && stack.indexOf('detail') >= 0) { stack.splice(stack.indexOf('detail'), 1); $('#detail').classList.remove('open'); }
    renderAll();
  });

  /* =========================================================
     16. ISHGA TUSHIRISH
     ========================================================= */
  icons();
  $('#vcLead').textContent = LEAD;
  renderAll();
})();
</script>
</body>
</html>
