<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confidence — Tizimga kirish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------------- macOS THEME VARIABLES ---------------- */
    :root {
      --bg: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.8);
      --text-1: #1d1d1f;
      --text-2: #86868b;
      --text-3: #a1a1a6;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #448edf;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --bad: #ff3b30;
      --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.08);
      --radius-lg: 18px;
      --radius-sm: 8px;
      --blur: blur(20px);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #1e1e1e;
      --card-bg: rgba(45, 45, 45, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-1: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #6e6e73;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #448edf;
      --accent-soft: rgba(10, 132, 255, 0.2);
      --bad: #ff453a;
      --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    /* ---------------- RESET ---------------- */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 10% 20%, rgba(0, 122, 255, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(52, 199, 89, 0.08) 0%, transparent 40%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; transition: background .3s ease, color .3s ease;
    }
    button, input { font-family: inherit; }

    /* ---------------- THEME SWITCH ---------------- */
    .theme-switch {
      position: fixed; top: 20px; right: 20px;
      display: flex; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 2px;
      border: 1px solid var(--border); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    }
    html[data-theme="dark"] .theme-switch { background: rgba(255,255,255,0.1); }
    .theme-switch button {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: var(--text-2);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s;
    }
    .theme-switch button.active { background: var(--card-bg); color: var(--text-1); box-shadow: 0 2px 5px rgba(0,0,0,0.15); }

    /* ---------------- LOGIN CARD ---------------- */
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-lg); padding: 32px 28px;
      box-shadow: var(--shadow-md); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    }

    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 20px; margin-bottom: 24px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px; background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.15); border: 1px solid var(--border); overflow: hidden;
    }
    .brand-icon img { width: 26px; height: 26px; object-fit: contain; }

    .login-head { text-align: center; margin-bottom: 24px; }
    .login-head h2 { font-size: 20px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.02em; }
    .login-head p { font-size: 13px; color: var(--text-2); margin: 0; }

    /* ---------------- FORM ---------------- */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap svg.input-icon { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--text-3); pointer-events: none; }
    .input-wrap input {
      width: 100%; font-size: 13px; color: var(--text-1);
      background: rgba(0,0,0,0.045); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 38px 10px 36px; outline: none; transition: all .15s ease;
    }
    html[data-theme="dark"] .input-wrap input { background: rgba(255,255,255,0.06); }
    .input-wrap input::placeholder { color: var(--text-3); }
    .input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--card-bg); }

    /* TO'G'IRLANGAN EYE TOGGLE STILI */
    .toggle-pwd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s ease, background .15s ease;
    }
    .toggle-pwd:hover { color: var(--text-1); background: rgba(0,0,0,0.05); }
    html[data-theme="dark"] .toggle-pwd:hover { background: rgba(255,255,255,0.08); }
    .toggle-pwd svg { width: 16px; height: 16px; display: block; }

    .btn-submit {
      width: 100%; margin-top: 8px; font-size: 14px; font-weight: 600;
      border-radius: var(--radius-sm); padding: 11px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      box-shadow: 0 2px 8px rgba(68, 142, 223, 0.3); transition: all .15s ease;
    }
    .btn-submit:hover { background: #3085e0; }
    .btn-submit:active { transform: scale(0.98); }

    .error-msg {
      display: none; background: rgba(255, 59, 48, 0.12); color: var(--bad);
      font-size: 12px; font-weight: 500; padding: 8px 12px; border-radius: var(--radius-sm);
      margin-bottom: 16px; text-align: center; border: 1px solid rgba(255, 59, 48, 0.2);
    }

    @media (max-width: 900px) {
      body { backdrop-filter: none !important; }
      .login-card { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: var(--bg); }
      html[data-theme="dark"] .login-card { background: #2a2a2a; }
    }
  </style>
</head>
<body>

  <!-- THEME SWITCH -->
  <div class="theme-switch">
    <button id="sunBtn" class="active" aria-label="Kunduzgi rejim"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg></button>
    <button id="moonBtn" aria-label="Tungi rejim"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></button>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">

    <div class="login-head">
      <h2>Tizimga kirish</h2>
      <p>Boshqaruv paneliga kirish uchun ma'lumotlarni kiriting</p>
    </div>

    <div id="errorMsg" class="error-msg">Login yoki parol noto'g'ri!</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username / Login</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" placeholder="Loginni kiriting" required autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="password">Parol</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Parolni kiriting" required autocomplete="current-password">
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Parolni ko'rsatish/yashirish">
            <!-- Yashirin holatdagi ikonka -->
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Kirish</button>
    </form>
  </div>

  <script>
    // Theme toggle
    const root = document.documentElement;
    const moonBtn = document.getElementById('moonBtn');
    const sunBtn = document.getElementById('sunBtn');

    moonBtn.addEventListener('click', () => {
      root.setAttribute('data-theme', 'dark');
      moonBtn.classList.add('active');
      sunBtn.classList.remove('active');
    });

    sunBtn.addEventListener('click', () => {
      root.setAttribute('data-theme', 'light');
      sunBtn.classList.add('active');
      moonBtn.classList.remove('active');
    });

    // Password visibility toggle
    const passwordInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('togglePwd');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeClosedSvg = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    const eyeOpenSvg = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;

    togglePwdBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      if (isPassword) {
        passwordInput.setAttribute('type', 'text');
        eyeIcon.innerHTML = eyeOpenSvg;
      } else {
        passwordInput.setAttribute('type', 'password');
        eyeIcon.innerHTML = eyeClosedSvg;
      }
    });

    // Simple Submit Validation
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === "admin" && p === "admin") {
        errorMsg.style.display = "none";
        alert("Xush kelibsiz!");
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
