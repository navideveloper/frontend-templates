<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<title>Qarz daftari</title>
<style>
  /* ============ FONTS (local SF Pro) ============ */
  @font-face{ font-family:"SF Pro"; src:url("fonts/sf-pro-text_regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:"SF Pro"; src:url("fonts/sf-pro-display_medium.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:"SF Pro"; src:url("fonts/sf-pro-text_bold.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; }

  /* ============ TOKENS ============ */
  :root{
    --font: "SF Pro", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;

    --bg:#ffffff; --side:#fbfbfa; --soft:#fafaf8; --soft2:#f4f4f2;
    --text:#32323a; --strong:#1f1f26; --muted:#74747c; --faint:#9b9ba3; --icon:#7b7b83;
    --border:#ebebe9; --border2:#e0e0dd; --hair:#f2f2ef; --hover:#f3f3f1; --active:#ededea;

    --accent:#7a5af8; --accent-ink:#4b2fd0; --accent-bg:#f6f3fe; --accent-bd:#e2dcfb;
    --debt:#c23b3b;  --debt-bg:#fdf1f0;  --debt-bd:#f4d2cf;
    --pay:#1a7f4e;   --pay-bg:#eff9f3;   --pay-bd:#c3e7d2;
    --soon:#a96906;  --soon-bg:#fdf6e9;  --soon-bd:#f0dcb4;
    --blue:#2b62b8;  --blue-bg:#eaf1fd;

    --r:12px;
    --shadow-sm:0 1px 2px rgba(23,23,28,.045);
    --shadow-md:0 4px 10px -2px rgba(23,23,28,.10), 0 0 0 1px rgba(23,23,28,.06);
    --shadow-lg:0 18px 40px -12px rgba(23,23,28,.28), 0 0 0 1px rgba(23,23,28,.07);
    --ease:cubic-bezier(.3,.9,.4,1);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--font); font-size:14px; line-height:1.45; color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input,select,textarea{ font:inherit; color:inherit; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3,p{ margin:0; }
  svg{ display:block; flex:none; }
  ::selection{ background:#dfd7ff; }
  [hidden]{ display:none !important; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ============ UMUMIY ELEMENTLAR ============ */
  .ib{
    width:40px; height:40px; min-width:40px; flex:0 0 40px; border-radius:var(--r);
    display:inline-flex; align-items:center; justify-content:center; color:var(--icon);
    border:1px solid var(--border2); background:#fff; box-shadow:0 1px 1px rgba(23,23,28,.03);
  }
  .ib:hover{ background:var(--hover); color:var(--text); }
  .ib.ghost{ border-color:transparent; box-shadow:none; background:var(--soft2); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px; flex:none;
    height:44px; padding:0 16px; border-radius:var(--r); font-weight:500; white-space:nowrap;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.985); }
  .btn-dark{
    background:linear-gradient(180deg,#3a3a44,#212127); color:#fff;
    box-shadow:0 1px 2px rgba(23,23,28,.24), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn-dark:hover{ background:linear-gradient(180deg,#45454f,#2a2a31); }
  .btn-line{ background:#fff; border:1px solid var(--border2); color:var(--text); box-shadow:0 1px 1px rgba(23,23,28,.03); }
  .btn-line:hover{ background:var(--hover); }
  .btn-accent{
    background:linear-gradient(180deg,#8b6ff9,#6a45f5); color:#fff;
    box-shadow:0 1px 2px rgba(95,57,243,.3), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .btn-accent:hover{ background:linear-gradient(180deg,#9479fa,#5f39f3); }
  .btn-danger{ background:#fff; border:1px solid var(--debt-bd); color:var(--debt); }
  .btn-danger:hover{ background:var(--debt-bg); }
  .btn.rec{ background:var(--accent-bg); border-color:var(--accent-bd); color:var(--accent-ink); animation:pulse 1.4s ease-in-out infinite; }
  .btn.paused{ background:linear-gradient(180deg,#8b6ff9,#6a45f5); border-color:transparent; color:#fff; }
  .btn.wide{ width:100%; }

  /* user ikonka — barcha profillar uchun bir xil; o'lcham qat'iy */
  .av{
    position:relative; width:42px; height:42px; min-width:42px; flex:0 0 42px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--soft2); border:1px solid var(--border2); color:var(--icon); box-shadow:inset 0 1px 0 #fff;
  }
  .av svg{ width:21px; height:21px; }
  .av.sm{ width:32px; height:32px; min-width:32px; flex-basis:32px;display: flex; }
  .av.sm svg{ width:16px; height:16px; }
  .av.lg{ width:52px; height:52px; min-width:52px; flex-basis:52px; border-radius:16px;display: flex; }
  .av.lg svg{ width:26px; height:26px; }
  .av .dot{ position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; border:2px solid #fff; background:#c3c3ca; }
  .dot.late{ background:#e2574c; } .dot.soon{ background:#e59217; } .dot.ok{ background:#22a565; }

  .chip-s{
    display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:99px;
    font-size:12px; font-weight:500; border:1px solid; white-space:nowrap;
  }
  .s-late{ color:var(--debt); background:var(--debt-bg); border-color:var(--debt-bd); }
  .s-soon{ color:var(--soon); background:var(--soon-bg); border-color:var(--soon-bd); }
  .s-ok{ color:var(--pay); background:var(--pay-bg); border-color:var(--pay-bd); }
  .s-neutral{ color:var(--muted); background:var(--soft2); border-color:var(--border2); }

  /* ============ JOYLASHUV ============ */
  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  .side{ display:none; }
  .pane-list{ flex:1; min-height:0; display:flex; flex-direction:column; background:#fff; }

  /* --- ro'yxat sarlavhasi --- */
  .lh{ flex:none; display:flex; align-items:center; gap:10px; padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top)); }
  .lh h1{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; font-size:18px; font-weight:500; letter-spacing:-.02em; color:var(--strong); }
  .badge{ font-size:12px; font-weight:500; color:var(--muted); background:var(--soft2); border:1px solid var(--border); border-radius:99px; padding:0 8px; line-height:20px; font-variant-numeric:tabular-nums; }
  .tools{ flex:none; display:flex; gap:8px; padding:2px 14px 12px; }
  .search{
    flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:42px; padding:0 12px;
    border:1px solid var(--border2); border-radius:var(--r); background:#fff; color:var(--faint);
    box-shadow:0 1px 1px rgba(23,23,28,.03);
  }
  .search:focus-within{ border-color:#c9bdfc; box-shadow:0 0 0 3px rgba(122,90,248,.12); }
  .search input{ flex:1; min-width:0; border:0; outline:0; background:none; font-size:15px; color:var(--strong); }
  .search input::placeholder{ color:var(--faint); }
  .search input::-webkit-search-cancel-button{ -webkit-appearance:none; }
  .ib .tdot{ position:absolute; top:8px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--accent); display:none; }
  .ib.on{ position:relative; color:var(--accent-ink); border-color:var(--accent-bd); background:var(--accent-bg); }
  .ib.on .tdot{ display:block; }

  .list-scroll{ flex:1; min-height:0; overflow-y:auto; padding-bottom:calc(90px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); }

  /* --- jami qator --- */
  .sumbar{ display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--soft); border-bottom:1px solid var(--border); }
  .sumbar .t{ flex:1; min-width:0; }
  .sumbar .lb{ display:block; font-size:12px; color:var(--muted); }
  .sumbar .v{ display:block; font-size:17px; font-weight:500; letter-spacing:-.02em; color:var(--strong); font-variant-numeric:tabular-nums; }
  .sumbar .v small{ font-size:12px; font-weight:400; color:var(--faint); margin-left:3px; letter-spacing:0; }
  .sumbar .chip-s{ height:28px; padding:0 11px; font-size:12.5px; cursor:pointer; }
  .sumbar .chip-s.on{ background:var(--debt); color:#fff; border-color:var(--debt); }

  /* --- qatorlar --- */
  .row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:12px 16px; border-bottom:1px solid var(--hair); background:#fff; transition:background .12s ease;
  }
  .row:hover{ background:var(--soft); }
  .row:active{ background:var(--hover); }
  .row.sel{ background:var(--accent-bg); }
  .row.sel .av{ border-color:var(--accent-bd); color:var(--accent); background:#fff; }
  .row.flash{ animation:flash 1.8s ease; }
  @keyframes flash{ 0%,30%{ background:#efe9ff; } 100%{ background:#fff; } }
  .row .mid{ flex:1; min-width:0; }
  .row .nm{ display:block; font-size:15px; font-weight:500; color:var(--strong); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .sub{ display:flex; margin-top:4px; min-width:0; }
  .row .sub-t{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rt{ flex:none; text-align:right; }
  .amt{ display:block; font-size:15px; font-weight:500; letter-spacing:-.01em; color:var(--strong); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .amt small{ font-size:11.5px; font-weight:400; color:var(--faint); margin-left:3px; letter-spacing:0; }
  .amt.zero{ color:var(--faint); }
  .amt.adv{ color:var(--pay); }
  .amt .usd{ font-size:12px; color:var(--muted); font-weight:500; }
  .ago{ display:block; margin-top:4px; font-size:12.5px; color:var(--faint); white-space:nowrap; }

  /* --- bo'sh holat --- */
  .empty{ padding:56px 28px 40px; text-align:center; }
  .empty .art{ width:132px; height:132px; margin:0 auto 22px; border-radius:50%; background:var(--soft2); display:grid; place-items:center; }
  .empty .pg{
    width:64px; height:78px; border-radius:14px; background:#fff; border:1px solid var(--border);
    box-shadow:0 10px 24px -10px rgba(23,23,28,.25); display:grid; place-items:center; color:var(--icon);
    transform:rotate(-7deg); position:relative;
  }
  .empty .pg::before{ content:""; position:absolute; inset:6px -6px -6px 6px; border-radius:14px; background:#fff; border:1px solid var(--border); z-index:-1; transform:rotate(9deg); }
  .empty h3{ font-size:16.5px; font-weight:500; letter-spacing:-.015em; color:var(--strong); }
  .empty p{ margin:5px auto 0; max-width:280px; font-size:13.5px; color:var(--muted); }
  .empty .btn{ margin-top:18px; height:40px; }
  .empty.small{ padding:36px 24px; }

  /* ============ MIJOZ KARTASI (detail) ============ */
  .pane-detail{
    position:fixed; inset:0; z-index:40; background:var(--soft); display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .32s var(--ease), visibility 0s .32s;
  }
  .pane-detail.open{ transform:none; visibility:visible; transition:transform .32s var(--ease), visibility 0s; }
  .dt{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .dt:empty{ display:none; }
  .dt-top{ flex:none; display:flex; align-items:center; gap:8px; padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top)); background:#fff; border-bottom:1px solid var(--border); }
  .dt-top .sp{ flex:1; }
  .dt-body{ flex:1; min-height:0; overflow-y:auto; padding:14px 14px 20px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); overflow:hidden; }
  .card + .card{ margin-top:12px; }
  .hero{ padding:16px; }
  .hero-top{ display:flex; align-items:center; gap:12px; }
  .hero-top .t{ flex:1; min-width:0; }
  .hero .nm{ display:block; font-size:17px; font-weight:500; letter-spacing:-.015em; color:var(--strong); }
  .hero .chip-s{ margin-top:5px; }
  .hero .big{ margin-top:16px; font-size:31px; font-weight:500; letter-spacing:-.035em; line-height:1.1; color:var(--strong); font-variant-numeric:tabular-nums; }
  .hero .big small{ font-size:15px; font-weight:400; color:var(--faint); letter-spacing:0; margin-left:4px; }
  .hero .big.adv{ color:var(--pay); }
  .hero .usd2{ margin-top:4px; font-size:15px; font-weight:500; color:var(--muted); }
  .hero .lbl{ display:block; margin-top:3px; font-size:12.5px; color:var(--muted); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; }
  .cell{ padding:12px 14px; border-top:1px solid var(--hair); min-width:0; }
  .cell:nth-child(2n){ border-left:1px solid var(--hair); }
  .grid2.first .cell{ border-top:0; }
  .cell .lb{ display:block; font-size:12px; color:var(--muted); }
  .cell .v{ display:block; margin-top:2px; font-size:14.5px; font-weight:500; color:var(--strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .cell a.v{ color:var(--accent-ink); }
  .cell .v.none{ color:var(--faint); font-weight:400; }
  .notebar{ margin:0 14px; padding:10px 0; border-top:1px solid var(--hair); }
  .notebar p{ padding-left:10px; border-left:2px solid var(--accent-bd); font-size:13.5px; color:var(--muted); }

  .month{ padding:10px 14px; font-size:11.5px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); background:var(--soft); border-bottom:1px solid var(--hair); }
  .month:not(:first-child){ border-top:1px solid var(--hair); }
  .tx{ display:flex; align-items:center; gap:11px; padding:11px 6px 11px 14px; border-bottom:1px solid var(--hair); }
  .tx:last-child{ border-bottom:0; }
  .tx-ic{ width:36px; height:36px; min-width:36px; flex:0 0 36px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; border:1px solid; }
  .tx-ic.debt{ color:var(--debt); background:var(--debt-bg); border-color:var(--debt-bd); }
  .tx-ic.pay{ color:var(--pay); background:var(--pay-bg); border-color:var(--pay-bd); }
  .tx .mid{ flex:1; min-width:0; }
  .tx .tt{ display:block; font-size:14px; font-weight:500; color:var(--strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx .ss{ display:block; margin-top:2px; font-size:12.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx .rt{ flex:none; text-align:right; }
  .tx .am{ display:block; font-size:14px; font-weight:500; color:var(--strong); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tx .am.in{ color:var(--pay); }
  .tx .when{ display:block; margin-top:2px; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .kebab{ width:32px; height:36px; flex:none; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--faint); }
  .kebab:hover{ background:var(--hover); color:var(--text); }

  .dt-actions{
    flex:none; display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:#fff; border-top:1px solid var(--border);
  }
  .dt-actions .ib{ width:48px; height:48px; flex-basis:48px; min-width:48px; }
  .act-debt, .act-pay{
    flex:1; height:48px; border-radius:var(--r); display:inline-flex; align-items:center; justify-content:center; gap:7px;
    font-weight:500; border:1px solid; transition:filter .15s ease, transform .1s ease;
  }
  .act-debt:active, .act-pay:active{ transform:scale(.985); }
  .act-debt{ color:var(--debt); background:var(--debt-bg); border-color:var(--debt-bd); }
  .act-pay{ color:var(--pay); background:var(--pay-bg); border-color:var(--pay-bd); }
  .act-debt:hover, .act-pay:hover{ filter:brightness(.98); }
  .dt-empty{ flex:1; display:none; }

  /* ============ PASTKI NAVIGATSIYA ============ */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; align-items:center;
    height:calc(66px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
  }
  .tab{ flex:1; height:100%; display:grid; place-items:center; align-content:center; gap:3px; font-size:11.5px; font-weight:500; color:var(--faint); }
  .tab .pill{ width:48px; height:30px; border-radius:10px; display:grid; place-items:center; transition:background .15s ease; }
  .tab.on{ color:var(--strong); }
  .tab.on .pill{ background:var(--soft2); }
  .tab-mid{ flex:0 0 96px; display:grid; place-items:center; height:100%; }
  .fab{
    width:60px; height:60px; border-radius:50%; margin-top:-26px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(180deg,#8b6ff9,#6a45f5);
    box-shadow:0 10px 22px -8px rgba(122,90,248,.7), 0 0 0 5px #fff, inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .16s cubic-bezier(.3,1.2,.5,1);
  }
  .fab:active{ transform:scale(.94); }

  /* ============ QATLAMLAR (oyna / to'liq ekran) ============ */
  .backdrop{ position:fixed; inset:0; z-index:55; background:rgba(23,23,28,.36); opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .backdrop.on{ opacity:1; pointer-events:auto; }
  .layer{
    position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:#fff;
    transform:translateY(102%); visibility:hidden;
    transition:transform .34s var(--ease), visibility 0s .34s;
  }
  .layer.open{ transform:none; visibility:visible; transition:transform .34s var(--ease), visibility 0s; }
  .layer.sheet{ top:auto; max-height:84vh; border-radius:20px 20px 0 0; box-shadow:var(--shadow-lg); }
  .layer.sheet::before{ content:""; display:block; width:38px; height:4px; border-radius:99px; background:#dcdcd8; margin:8px auto 0; flex:none; }

  .ly-head{ flex:none; display:flex; align-items:center; gap:12px; padding:12px 14px 12px 16px; padding-top:max(12px, env(safe-area-inset-top)); border-bottom:1px solid var(--border); }
  .layer.sheet .ly-head{ padding-top:10px; }
  .ly-head .t{ flex:1; min-width:0; }
  .ly-head .t b{ display:block; font-size:16px; font-weight:500; letter-spacing:-.015em; color:var(--strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ly-head .t span{ display:block; font-size:12.5px; color:var(--muted); }
  .ly-ic{ width:38px; height:38px; min-width:38px; flex:0 0 38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; border:1px solid; }
  .ly-ic.debt{ color:var(--debt); background:var(--debt-bg); border-color:var(--debt-bd); }
  .ly-ic.pay{ color:var(--pay); background:var(--pay-bg); border-color:var(--pay-bd); }
  .ly-ic.plain{ color:var(--icon); background:var(--soft2); border-color:var(--border2); }
  .ly-body{ flex:1; min-height:0; overflow-y:auto; padding:16px; }
  .ly-foot{ flex:none; display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:#fff; }
  .ly-foot .btn{ flex:1; height:48px; }

  /* ============ FORMA ============ */
  .fld{ margin-bottom:16px; }
  .fld > .lab{ display:flex; align-items:center; gap:6px; margin-bottom:7px; font-size:11.5px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .fld > .lab .ai-tag{ display:none; align-items:center; gap:3px; text-transform:none; letter-spacing:0; font-size:11px; color:var(--accent); }
  .fld.ai > .lab .ai-tag{ display:inline-flex; }
  .inp{
    width:100%; height:48px; padding:0 14px; border:1px solid var(--border2); border-radius:var(--r);
    background:#fff; font-size:16px; color:var(--strong); outline:0; box-shadow:0 1px 1px rgba(23,23,28,.03);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .inp::placeholder{ color:var(--faint); }
  .inp:focus{ border-color:#b9a9fb; box-shadow:0 0 0 3px rgba(122,90,248,.13); }
  .fld.ai .inp{ border-color:var(--accent-bd); background:#fdfcff; }
  .fld.err .inp{ border-color:#eba49c; background:#fffafa; animation:shake .3s; }
  @keyframes shake{ 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  textarea.inp{ height:auto; min-height:88px; padding:12px 48px 12px 14px; resize:none; line-height:1.45; }
  input[type=date].inp{ padding-right:10px; }
  .wrapi{ position:relative; }
  .inp.sum{ padding-right:96px; font-weight:500; font-variant-numeric:tabular-nums; font-size:18px; }
  .cur{ position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; padding:3px; gap:2px; background:var(--soft2); border-radius:9px; }
  .cur button{ height:30px; min-width:38px; padding:0 9px; border-radius:7px; font-size:12.5px; font-weight:500; color:var(--muted); }
  .cur button.on{ background:#fff; color:var(--strong); box-shadow:0 1px 2px rgba(23,23,28,.1); }
  .mic-in{ position:absolute; right:8px; bottom:8px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--icon); background:var(--soft2); }
  .mic-in:hover{ color:var(--text); }
  .mic-in.rec{ color:#fff; background:var(--accent); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 5px rgba(122,90,248,.18); } }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chips + .inp, .chips + .wrapi{ margin-top:8px; }
  .chip{
    height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--border2); background:#fff;
    font-size:13.5px; font-weight:500; color:var(--muted); white-space:nowrap;
  }
  .chip:hover{ color:var(--text); background:var(--soft); }
  .chip.on{ background:var(--strong); color:#fff; border-color:var(--strong); }
  .chip.sm{ height:30px; padding:0 11px; font-size:12.5px; border-radius:9px; }
  .hint{ margin-top:7px; font-size:13px; color:var(--muted); }
  .hint b{ font-weight:500; color:var(--strong); font-variant-numeric:tabular-nums; }
  .hint.ok b{ color:var(--pay); }
  .hint.warn{ color:var(--soon); }
  .hint.warn b{ color:var(--soon); }

  .heard{ margin-bottom:16px; padding:12px 14px; border-radius:var(--r); background:var(--soft); border:1px solid var(--border); }
  .heard .lb{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:4px; }
  .heard .lb .live{ display:none; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1.2s infinite; }
  .heard.live .lb .live{ display:inline-block; }
  .heard p{ font-size:14px; color:var(--text); line-height:1.55; }
  .heard.live p::after{ content:""; display:inline-block; width:2px; height:15px; margin-left:2px; vertical-align:-2px; background:var(--accent); animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  mark{ padding:0 3px; border-radius:5px; font-weight:500; }
  mark.h-name{ background:#efeafe; color:var(--accent-ink); }
  mark.h-sum{ background:#e4f5eb; color:var(--pay); }
  mark.h-due{ background:#fcf0dc; color:var(--soon); }
  mark.h-phone{ background:var(--blue-bg); color:var(--blue); }
  .warnbox{ margin-top:8px; padding:9px 12px; border-radius:10px; background:var(--soon-bg); border:1px solid var(--soon-bd); color:var(--soon); font-size:12.5px; }

  .match{
    display:flex; align-items:center; gap:11px; margin:0 0 16px; padding:11px 12px;
    border-radius:var(--r); background:var(--accent-bg); border:1px solid var(--accent-bd);
  }
  .match .t{ flex:1; min-width:0; }
  .match b{ display:block; font-size:14px; font-weight:500; color:var(--strong); }
  .match span{ display:block; font-size:12.5px; color:var(--muted); }
  .match button{ flex:none; font-size:12.5px; font-weight:500; color:var(--accent-ink); padding:6px 4px; }
  .match .av{ background:#fff; border-color:var(--accent-bd); color:var(--accent); }
  .sug{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .sug:empty{ display:none; }
  .sug button{
    display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px; border-radius:9px;
    background:var(--soft2); font-size:13px; color:var(--text);
  }
  .sug button span{ color:var(--faint); font-variant-numeric:tabular-nums; }

  /* ============ OVOZ EKRANI ============ */
  .vc-top{ flex:none; display:flex; justify-content:flex-end; padding:12px 14px; padding-top:max(12px, env(safe-area-inset-top)); }
  .vc{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center; width:100%; max-width:400px; margin:0 auto; padding:8px 24px calc(28px + env(safe-area-inset-bottom)); text-align:center; }
  .vc > section{ display:none; }
  .vc[data-state="idle"] .vc-idle, .vc[data-state="rec"] .vc-rec, .vc[data-state="pause"] .vc-rec, .vc[data-state="busy"] .vc-busy{ display:block; }
  .vc .only-pause{ display:none !important; }
  .vc[data-state="pause"] .only-pause{ display:flex !important; }
  .vc[data-state="pause"] .only-rec{ display:none !important; }
  .vc[data-state="pause"] .bars i{ background:#cfc6f7; }
  .vc[data-state="pause"] .timer{ color:var(--muted); }
  .stopbtn.resume{ background:linear-gradient(180deg,#8b6ff9,#6a45f5); }
  .vc-mic{
    width:92px; height:92px; border-radius:50%; margin:0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(180deg,#3a3a44,#212127);
    box-shadow:0 12px 28px -10px rgba(23,23,28,.55), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .16s cubic-bezier(.3,1.2,.5,1);
  }
  .vc-mic:active{ transform:scale(.95); }
  .vc-lead{ margin:20px auto 0; max-width:290px; font-size:14.5px; color:var(--muted); }
  .vc-lead.err{ color:var(--debt); }
  .vc-or{ display:flex; align-items:center; gap:12px; margin:26px 0 14px; font-size:12px; color:var(--faint); }
  .vc-or::before, .vc-or::after{ content:""; flex:1; height:1px; background:var(--border); }
  .vc .btn.wide + .btn.wide{ margin-top:8px; }
  .wavepill{ display:flex; align-items:center; gap:12px; height:64px; padding:0 8px 0 18px; border-radius:99px; background:var(--soft2); border:1px solid var(--border); }
  .bars{ flex:1; min-width:0; height:40px; display:flex; align-items:center; gap:2px; overflow:hidden; }
  .bars i{ flex:1; min-width:2px; max-width:4px; height:4px; border-radius:2px; background:linear-gradient(180deg,#9b82fa,#6a45f5); transition:height .09s linear; }
  .timer{ flex:none; font-size:15px; font-weight:500; color:var(--strong); font-variant-numeric:tabular-nums; }
  .stopbtn{ width:48px; height:48px; flex:none; border-radius:50%; display:grid; place-items:center; color:#fff; background:linear-gradient(180deg,#3a3a44,#212127); }
  .vc-title{ margin-top:24px; font-size:19px; font-weight:500; letter-spacing:-.02em; color:var(--strong); }
  .vc-sub{ margin-top:6px; font-size:13.5px; color:var(--muted); }
  .vc-live{ min-height:48px; margin:18px 0 20px; font-size:15.5px; line-height:1.5; color:var(--strong); }
  .vc-live:empty::before{ content:"…"; color:var(--faint); }
  .spinner{ width:40px; height:40px; margin:0 auto; border-radius:50%; border:3px solid var(--accent-bd); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ MENYU / SOZLAMALAR ============ */
  .opt-h{ padding:14px 18px 6px; font-size:11.5px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .opt{ display:flex; align-items:center; gap:12px; width:100%; padding:13px 18px; font-size:15px; color:var(--strong); text-align:left; }
  .opt:hover{ background:var(--soft); }
  .opt .ck{ margin-left:auto; color:var(--accent); visibility:hidden; }
  .opt.on .ck{ visibility:visible; }
  .opt.on{ font-weight:500; }
  .opt.danger{ color:var(--debt); }
  .opt svg{ color:var(--icon); }
  .opt.danger svg{ color:var(--debt); }
  .sheet-pad{ padding-bottom:calc(10px + env(safe-area-inset-bottom)); }

  .prof{ display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); border-radius:14px; margin-bottom:18px; }
  .prof b{ display:block; font-size:15.5px; font-weight:500; color:var(--strong); }
  .prof span{ display:block; font-size:13px; color:var(--muted); }
  .seg{ display:flex; padding:3px; gap:3px; background:var(--soft2); border-radius:var(--r); }
  .seg button{ flex:1; height:40px; border-radius:9px; font-weight:500; color:var(--muted); }
  .seg button.on{ background:#fff; color:var(--strong); box-shadow:0 1px 2px rgba(23,23,28,.1); }
  .small-note{ margin-top:6px; font-size:12.5px; color:var(--faint); }
  .stack{ display:flex; flex-direction:column; gap:8px; }

  /* ============ TOAST ============ */
  .toast{
    position:fixed; left:50%; z-index:90; bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translate(-50%, 14px); display:flex; align-items:center; gap:12px;
    max-width:calc(100% - 28px); padding:11px 12px 11px 15px; border-radius:var(--r);
    background:#22222a; color:#fff; font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:all .24s cubic-bezier(.3,1,.5,1);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .toast .tx-t{ min-width:0; }
  .toast button{ flex:none; height:30px; padding:0 10px; border-radius:8px; color:#c9bdfc; font-weight:500; background:rgba(255,255,255,.08); }

  /* ============ DESKTOP ============ */
  @media (min-width: 900px){
    .app{ display:grid; grid-template-columns:240px minmax(340px, 400px) minmax(0, 1fr); flex-direction:row; }
    .mob{ display:none !important; }
    .tabbar{ display:none; }

    .side{ display:flex; flex-direction:column; padding:10px 10px 0; background:var(--side); border-right:1px solid var(--border); min-height:0; }
    .brand{ display:flex; align-items:center; gap:10px; padding:6px 6px 14px; }
    .brand-mark{ width:30px; height:30px; min-width:30px; border-radius:9px; display:grid; place-items:center; color:#fff; background:linear-gradient(160deg,#8b6ff9,#5f39f3); box-shadow:0 1px 2px rgba(95,57,243,.34), inset 0 1px 0 rgba(255,255,255,.22); }
    .brand b{ font-size:15px; font-weight:500; letter-spacing:-.015em; color:var(--strong); }
    .side .new{ width:100%; height:42px; margin-bottom:14px; justify-content:flex-start; padding:0 12px; }
    .side .new .kbd{ margin-left:auto; font-size:11px; font-weight:500; padding:1px 6px; border-radius:5px; background:rgba(255,255,255,.18); }
    .nav{ flex:1; }
    .nav-i{ display:flex; align-items:center; gap:10px; width:100%; height:36px; padding:0 10px; border-radius:9px; font-weight:500; color:var(--text); }
    .nav-i svg{ color:var(--icon); }
    .nav-i:hover{ background:var(--hover); }
    .nav-i.on{ background:var(--active); color:var(--strong); }
    .nav-i.on svg{ color:var(--strong); }
    .nav-i .badge{ margin-left:auto; background:transparent; border:0; }
    .side-foot{ border-top:1px solid var(--border); margin:0 -10px; padding:10px; }
    .me{ display:flex; align-items:center; gap:10px; width:100%; padding:6px; border-radius:10px; text-align:left; }
    .me:hover{ background:var(--hover); }
    .me .t{ flex:1; min-width:0; }
    .me b{ display:block; font-size:13.5px; font-weight:500; color:var(--strong); }
    .me span{ display:block; font-size:12px; color:var(--faint); }

    .pane-list{ border-right:1px solid var(--border); min-height:0; }
    .lh{ padding:14px 16px 10px; }
    .tools{ padding:0 16px 12px; }
    .list-scroll{ padding-bottom:16px; }
    .row{ padding:11px 16px; }

    .pane-detail{ position:relative; inset:auto; z-index:auto; transform:none; visibility:visible; transition:none; min-height:0; }
    .back-btn{ display:none !important; }
    .dt-top{ padding:14px 20px; }
    .dt-body{ padding:20px; }
    .dt-body > *{ max-width:640px; margin-left:auto; margin-right:auto; }
    .dt-actions{ padding:14px 20px; justify-content:center; }
    .dt-actions-in{ display:flex; gap:8px; width:100%; max-width:640px; }
    .dt-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); padding:40px; }
    .dt-empty .av{ margin-bottom:14px; }
    .dt-empty b{ font-size:15px; font-weight:500; color:var(--strong); }
    .pane-detail.has .dt-empty{ display:none; }

    .layer{
      inset:auto; top:50%; left:50%; width:500px; max-height:min(800px, calc(100vh - 48px));
      border-radius:18px; box-shadow:var(--shadow-lg); opacity:0;
      transform:translate(-50%,-47%) scale(.98);
      transition:transform .2s ease, opacity .2s ease, visibility 0s .2s;
    }
    .layer.open{ opacity:1; transform:translate(-50%,-50%); transition:transform .2s ease, opacity .2s ease, visibility 0s; }
    .layer.sheet{ width:380px; bottom:auto; border-radius:18px; }
    .layer.sheet::before{ display:none; }
    .layer.full{ height:min(640px, calc(100vh - 48px)); }
    .ly-head{ padding-top:14px; }
    .ly-foot{ padding-bottom:14px; }
    .toast{ bottom:24px; }
  }
  .dt-actions-in{ display:flex; gap:8px; width:100%; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===================== SIDEBAR (desktop) ===================== -->
  <aside class="side">
    <div class="brand">
      <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9.5 3v6l2-1.4 2 1.4V3"/></svg></span>
      <b>Qarz daftari</b>
    </div>
    <button class="btn btn-accent new" data-act="voice">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
      Yangi qarz <span class="kbd">Space</span>
    </button>
    <nav class="nav">
      <button class="nav-i on" data-act="tab" data-v="client">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9.5 3v6l2-1.4 2 1.4V3"/></svg>
        Mijozlar <span class="badge" id="navCountClient">0</span>
      </button>
      <button class="nav-i" data-act="tab" data-v="supplier">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12.5" rx="2.2"/><circle cx="12" cy="12.25" r="2.6"/><path d="M6 9.5h.01M18 15h.01"/></svg>
        Qarzlarim <span class="badge" id="navCountSupplier">0</span>
      </button>
    </nav>
    <div class="side-foot">
      <button class="me" data-act="settings">
        <span class="av sm" data-icon="user"></span>
        <span class="t"><b>Qudratillo</b><span>Sozlamalar</span></span>
      </button>
    </div>
  </aside>

  <!-- ===================== RO'YXAT ===================== -->
  <section class="pane-list">
    <header class="lh">
      <button class="ib ghost mob" data-act="settings" aria-label="Profil va sozlamalar"><span data-icon="user"></span></button>
      <h1><span id="tabTitle">Mijozlar</span> <span class="badge" id="tabCount">0</span></h1>
      <button class="ib" data-act="add" aria-label="Qo'lda qo'shish"><span data-icon="plus"></span></button>
    </header>
    <div class="tools">
      <label class="search">
        <span data-icon="search"></span>
        <input id="q" type="search" placeholder="Ism yoki telefon…" autocomplete="off" />
      </label>
      <button class="ib" id="btnFilter" data-act="menu" data-v="filter" aria-label="Filtr"><span data-icon="filter"></span><i class="tdot"></i></button>
      <button class="ib" id="btnSort" data-act="menu" data-v="sort" aria-label="Tartib"><span data-icon="sort"></span><i class="tdot"></i></button>
    </div>
    <div class="list-scroll" id="listScroll">
      <div id="sumbar"></div>
      <div id="list"></div>
    </div>
  </section>

  <!-- ===================== MIJOZ KARTASI ===================== -->
  <section class="pane-detail" id="detail" aria-hidden="true">
    <div class="dt" id="dt"></div>
    <div class="dt-empty">
      <span class="av lg" data-icon="user"></span>
      <b>Mijozni tanlang</b>
      <p>Ro'yxatdan birini tanlang yoki ovoz bilan yangi qarz yozing.</p>
    </div>
  </section>

  <!-- ===================== PASTKI NAVIGATSIYA ===================== -->
  <nav class="tabbar">
    <button class="tab on" data-act="tab" data-v="client">
      <span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9.5 3v6l2-1.4 2 1.4V3"/></svg></span>
      Mijozlar
    </button>
    <div class="tab-mid">
      <button class="fab" data-act="voice" aria-label="Ovoz bilan qarz yozish">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
      </button>
    </div>
    <button class="tab" data-act="tab" data-v="supplier">
      <span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12.5" rx="2.2"/><circle cx="12" cy="12.25" r="2.6"/><path d="M6 9.5h.01M18 15h.01"/></svg></span>
      Qarzlarim
    </button>
  </nav>

  <div class="backdrop" id="backdrop"></div>

  <!-- ===================== OVOZ ===================== -->
  <div class="layer full" id="lyVoice" role="dialog" aria-modal="true" aria-label="Ovoz bilan kiritish" aria-hidden="true">
    <div class="vc-top"><button class="ib ghost" data-act="close" aria-label="Yopish"><span data-icon="x"></span></button></div>
    <div class="vc" id="vc" data-state="idle">
      <section class="vc-idle">
        <button class="vc-mic" data-act="v-start" aria-label="Gapirishni boshlash"><span data-icon="mic-lg"></span></button>
        <p class="vc-lead" id="vcLead"></p>
        <div class="vc-or">yoki</div>
        <button class="btn btn-line wide" data-act="v-manual"><span data-icon="pen"></span>Qarzni yozib kiritish</button>
        <button class="btn btn-line wide" data-act="v-photo"><span data-icon="image"></span>Daftar suratini yuklash</button>
      </section>
      <section class="vc-rec">
        <div class="wavepill">
          <div class="bars" id="vcBars"></div>
          <span class="timer" id="vcTime">0:00</span>
          <button class="stopbtn only-rec" data-act="v-send" aria-label="To'xtatish va yuborish"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
          <button class="stopbtn resume only-pause" data-act="v-resume" aria-label="Davom etish"><span data-icon="mic"></span></button>
        </div>
        <h2 class="vc-title" id="vcTitle">Gapiring — tinglayapman</h2>
        <p class="vc-sub" id="vcSub"></p>
        <p class="vc-live" id="vcLive"></p>
        <button class="btn btn-accent wide only-pause" data-act="v-resume"><span data-icon="mic"></span>Davom etish</button>
        <button class="btn btn-dark wide" data-act="v-send">Yuborish</button>
        <button class="btn btn-line wide" data-act="v-cancel">Bekor qilish</button>
      </section>
      <section class="vc-busy">
        <div class="spinner"></div>
        <h2 class="vc-title">Tushunib olyapman…</h2>
        <p class="vc-live" id="vcHeard"></p>
      </section>
    </div>
  </div>

  <!-- ===================== FORMALAR (JS to'ldiradi) ===================== -->
  <div class="layer" id="lyForm" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div class="layer" id="lyPay" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div class="layer" id="lyClient" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div class="layer" id="lySettings" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div class="layer sheet" id="lyMenu" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <input type="file" id="fileIn" accept="image/*" capture="environment" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. IKONKALAR
     ========================================================= */
  var SVG = function(body, size, sw){
    return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.7) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';

  function openDue(c){
    var best = null;
    ['UZS', 'USD'].forEach(function(cur){

      c.recs.forEach(function(r){ if (r.type === 'pay' && curOf(r) === cur) paid += r.sum; });

        .forEach(function(r){

          paid = 0;
          if (r.due && (best === null || r.due < best)) best = r.due;

    });

  /* Ibora uchun moslashuvchan regex: apostrof turlari, so'zlar orasidagi

  var WCH = "a-z0-9'\\u2018\\u2019\\u02bb\\u02bc\\u00c0-\\u024f";
  function looseRe(phrase, flags, suffix){
    var words = norm(phrase).split(/[\s,.;:!?\-]+/).filter(Boolean);
    if (!words.length) return null;
    var parts = words.map(function(w){
      return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/'/g, "['\\u2018\\u2019\\u02bb\\u02bc`]");
    });

    var suf = suffix == null ? "[" + WCH + "]*" : suffix + "(?![" + WCH + "])";
    return new RegExp("(^|[^" + WCH + "])(" + parts.join("[\\s,.;:!?\\-]+") + suf + ")", flags || 'i');
  }

    while (i < toks.length) {

      if (NUMW[toks[i]] != null && NUMW[toks[i]] >= 10) { v += NUMW[toks[i]]; i++; ok = true; }
      if (NUMW[toks[i]] != null && NUMW[toks[i]] < 10 && toks[i + 1] !== 'yuz') { v += NUMW[toks[i]]; i++; ok = true; }
      if (!ok) break;
      out.push(String(v));

    var ds = out.join('');

    }
    /* "o'n beshinchi oktyabrda", "yigirmanchi noyabr" */
    var toks = t.replace(/[,.;:]/g, ' ').split(/\s+/);
    for (var i = 1; i < toks.length; i++) {
      var mi = monthIdx(toks[i]);
      if (mi < 0) continue;
      var a = ordWord(toks[i - 1]);
      if (a == null) continue;
      var b = i > 1 ? NUMW[toks[i - 2]] : null, day = a, used = toks[i - 1] + ' ' + toks[i];
      if (b != null && b >= 10 && a < 10) { day = b + a; used = toks[i - 2] + ' ' + used; }
      if (day >= 1 && day <= 31) return res(dateOf(mi, day), used);
    }
    if ((m = t.match(/oy(ning)?\s*(oxiri|oxirida)/))) return res(new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0), m[0]);
    if ((m = t.match(/oy(ning)?\s*(\d{1,2})\s*(si|sida|da)?/))) {
      var day2 = parseInt(m[2], 10), dt2 = new Date(TODAY.getFullYear(), TODAY.getMonth(), day2);
      if (dt2 < startOf(TODAY)) dt2 = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, day2);
      return res(dt2, m[0]);
    }
    if ((m = t.match(/(\d{1,3})\s*kun/)))   return res(d(parseInt(m[1], 10)), m[0]);
    if ((m = t.match(/(\d{1,2})\s*hafta/))) return res(d(parseInt(m[1], 10) * 7), m[0]);
    if ((m = t.match(/(\d{1,2})\s*oy(dan|da|ga)/))) return res(d(parseInt(m[1], 10) * 30), m[0]);
    if ((m = t.match(/(bir|ikki|uch)\s*kun/)))   return res(d(NUMW[m[1]]), m[0]);
    if ((m = t.match(/(bir|ikki|uch)\s*hafta/))) return res(d(NUMW[m[1]] * 7), m[0]);
    if ((m = t.match(/(bir|ikki|uch)\s*oy/)))    return res(d(NUMW[m[1]] * 30), m[0]);
    if ((m = t.match(/(dushanba|seshanba|chorshanba|payshanba|juma|shanba|yakshanba)/))) {
      var add = (WD.indexOf(m[1]) - TODAY.getDay() + 7) % 7 || 7;
      return res(d(add), m[0]);
    }
    if ((m = t.match(/hafta\s*(oxiri|oxirida)/))) {
      var add2 = (6 - TODAY.getDay() + 7) % 7 || 7;
      return res(d(add2), m[0]);
    }
    return null;
  }

  /* Summa: raqam faqat "ming / million / so'm / dollar" so'ziga bog'langanda
     summa hisoblanadi. "3 qop", "2 litr", telefon va sanadagi raqamlar qo'shilmaydi. */
  function parseSum(text){
    var toks = norm(String(text).replace(/\$/g, ' dollar ')).replace(/[^0-9a-z'\s]/g, ' ').split(/\s+/).filter(Boolean);
    var total = 0, grp = 0, anchored = false, pend = [], phrases = [], cur = 'UZS', longHits = 0;

    function isNumTok(t){ return /^\d+$/.test(t) || NUMW[t] != null || t === 'yuz' || t === 'yarim'; }
    function commit(tok){ phrases.push(pend.concat([tok]).join(' ')); pend = []; }
    function drop(){ grp = 0; pend = []; }

    for (var i = 0; i < toks.length; i++) {
      var t = toks[i], nx = toks[i + 1] || '';
      if (isNumTok(t)) {
        if (UNITW.indexOf(nx) >= 0) { drop(); continue; }
        if (t === 'yuz') grp = (grp || 1) * 100;
        else if (t === 'yarim') grp += 0.5;
        else {
          if (/^\d{4,}$/.test(t)) longHits += 1;
          grp += /^\d+$/.test(t) ? parseInt(t, 10) : NUMW[t];
        }
        pend.push(t);
        continue;
      }
      if (MAG[t] != null) { total += (grp || 1) * MAG[t]; grp = 0; anchored = true; commit(t); continue; }
      if (/^(dollar|dollor|usd)/.test(t)) {
        if (grp > 0) { total += grp; grp = 0; commit(t); }
        if (total > 0) { anchored = true; cur = 'USD'; }
        continue;
      }
      if (/^so'?m/.test(t) || t === 'sum' || t === 'pul') {
        if (grp > 0) { total += grp; grp = 0; anchored = true; commit(t); }
        continue;
      }
      drop();
    }

    if (!anchored) {
      var big = toks.filter(function(t){ return /^\d{4,}$/.test(t) && t.length !== 9 && t.length !== 12; });
      if (big.length === 1) {
        var v = parseInt(big[0], 10);
        return { value:v, cur:'UZS', phrases:[big[0]], weak:true, over:v > SUM_MAX };
      }
      return null;
    }
    total = Math.round(total);
    if (total < (cur === 'USD' ? 1 : 100)) return null;
    return { value:total, cur:cur, phrases:phrases, over:cur === 'UZS' && total > SUM_MAX, weak:longHits > 1 };
  }

  function skipName(lw){
    return FILLER.indexOf(lw) >= 0 || STOP.indexOf(lw) >= 0 || /^\d/.test(lw) || NUMW[lw] != null ||
      MAG[lw] != null || UNITW.indexOf(lw) >= 0 || /^so'?m/.test(lw) || /^(qarz|to'?la|dollar|telefon)/.test(lw) ||
      lw === 'yuz' || lw === 'yarim' || lw === 'naqd' || lw === 'click';
  }

  function parseName(text){
    var known = null, hit = null;
    pool().forEach(function(p){
      if (known) return;
      /* hurmat so'zlari bo'yicha moslashtirmaymiz: "aka" hammada bor */
      var parts = norm(p.name).split(/[\s\u2014-]+/).filter(function(w){ return w.length > 2 && HONOR.indexOf(w) < 0; });
      for (var i = 0; i < parts.length; i++) {
        var r = rangeOf(text, parts[i], NAME_SUF);
        if (r) { known = p; hit = text.slice(r[0], r[1]); return; }
      }
    });
    if (known) return { value:known.name, person:known, hit:hit };

    var raw = String(text).trim().split(/\s+/), out = [];
    for (var j = 0; j < raw.length; j++) {
      var w = raw[j].replace(/[^0-9A-Za-z'\u02bb\u2019\u00c0-\u024f]/g, ''), lw = norm(w);
      if (!w) continue;
      if (!out.length) { if (skipName(lw)) continue; out.push(w); continue; }
      if (HONOR.indexOf(lw) >= 0) { out.push(w); continue; }
      break;
    }
    if (!out.length) return null;
    var first = out[0];
    /* "Anvarga to'ladim" → Anvar (faqat -ga, qoldig'i yetarlicha uzun bo'lsa) */
    if (out.length === 1 && /ga$/i.test(first) && first.length >= 6) first = first.slice(0, -2);
    out[0] = first;
    return { value:cap(out.join(' ')), person:null, hit:out.join(' ') };
  }

  function numify(s){
    var w = s.split(' '), out = [], i = 0;
    while (i < w.length) {
      var j = i, toks = [], wordy = false;
      while (j < w.length && (NUMW[w[j]] != null || w[j] === 'yuz' || /^\d+$/.test(w[j]))) {
        if (!/^\d+$/.test(w[j])) wordy = true;
        toks.push(w[j]); j++;
      }
      if (toks.length && wordy && j < w.length && UNITW.indexOf(w[j]) >= 0) {
        out.push(String(cardinal(toks))); i = j; continue;
      }
      out.push(w[i]); i++;
    }
    return out.join(' ');
  }

  function parseItems(text, phrases){
    var t = ' ' + String(text) + ' ';
    phrases.forEach(function(ph){ if (ph) t = cut(t, ph); });
    var n = norm(t).replace(/\s+/g, ' ');
    var m = n.match(/so'?m(?:ga|lik)?\s+(.{3,90}?)\s*(?:qarzga|qarz|oldi|olib|ketdi|olgan|oldim|berdim|berdi|berib)/);
    if (m) return clean(m[1]);
    m = n.match(/(?:ga|lik)\s+([a-z0-9'\s,\.]{4,80}?)\s*(?:qarzga|qarz|oldi|olib)/);
    if (m) return clean(m[1]);
    /* "Behruz ikki qop un oldi" — ism kesilgach boshidagi bo'lak */
    m = n.replace(/^[\s,.]+/, '').match(/^([a-z0-9'\s,]{2,80}?)\s*(?:qarzga\s+)?(?:oldi|olib|oldim)(?![a-z])/);
    if (m) return clean(m[1]);
    return null;

    function clean(s){
      s = s.replace(/[.]+/g, ' ').replace(/\s*,\s*/g, ', ').replace(/\s+va\s+/g, ', ').replace(/\s+/g, ' ').trim();
      var w = s.split(' ');
      while (w.length && (FILLER.indexOf(w[0].replace(/,$/, '')) >= 0 || HONOR.indexOf(w[0].replace(/,$/, '')) >= 0)) w.shift();
      w = w.filter(function(x){ return !/^(qarz|qarzga|berdim|berdi)$/.test(x.replace(/,$/, '')); });
      s = numify(w.join(' ')).replace(/^[,\s]+|[,\s]+$/g, '');
      if (!s || s.length < 2) return null;
      return cap(s);
    }
  }

  function parseVoice(text){
    var t = norm(text);
    var res = { raw:String(text).trim(), hits:{ sum:[] } };

    var ph = parsePhone(text) || spokenPhone(text);
    var due = parseDue(text);
    var cuts = [];
    if (ph) cuts.push(ph.matched);
    if (due) cuts.push(due.matched);

    var sumSrc = ' ' + text + ' ';
    cuts.forEach(function(c){ if (c) sumSrc = cut(sumSrc, c); });
    var sum = parseSum(sumSrc);

    res.phone = ph ? ph.value : null;
    res.due = due ? due.date : null;
    res.sum = sum ? sum.value : null;
    res.cur = sum ? sum.cur : 'UZS';
    res.sumOver = !!(sum && sum.over);
    res.sumWeak = !!(sum && sum.weak);
    res.hits.phone = ph ? ph.matched : null;
    res.hits.due = due ? due.matched : null;
    res.hits.sum = sum ? sum.phrases : [];

    var nm = parseName(text);
    res.name = nm ? nm.value : null;
    res.person = nm ? nm.person : null;
    res.hits.name = nm ? nm.hit : null;

    var payWord = /(to'?la|tolab|to'?lab|berdi|qaytar|tashla|yopdi|yopildi|tushdi|oldim\s+pul)/.test(t);
    if (res.sum && payWord && !/qarzga/.test(t)) res.intent = 'pay';
    else if (res.sum) res.intent = 'debt';
    else if (res.person || (t.split(' ').length <= 4 && res.name)) res.intent = 'query';
    else res.intent = 'unknown';

    if (res.intent === 'debt') {
      res.items = parseItems(text, cuts.concat(sum ? sum.phrases : [], nm && nm.hit ? [nm.hit] : []));
    }
    return res;
  }

  /* to'lov izohi: summa va keraksiz so'zlar olib tashlangan qoldiq */
  function payNote(text, phrases){
    var t = ' ' + text + ' ';
    (phrases || []).forEach(function(p){ t = cut(t, p); });
    var w = norm(t).replace(/[,.]/g, ' ').split(/\s+/).filter(function(x){
      return x && STOP.indexOf(x) < 0 && FILLER.indexOf(x) < 0 && !/^so'?m/.test(x) && !/^(to'?la|berdi|qaytar)/.test(x);
    });
    return w.length ? cap(w.join(' ')) : '';
  }

  function findClient(q, kind){
    if (!q) return null;
    var list = clientsOf(kind || ui.tab), s = norm(q), hit = null;
    var key = norm(q).split(/\s+/).filter(function(w){ return HONOR.indexOf(w) < 0; })[0] || s;
    list.forEach(function(p){ if (!hit && norm(p.name) === s) hit = p; });
    if (hit) return hit;
    list.forEach(function(p){
      if (hit) return;
      var k = norm(p.name).split(/[\s\u2014-]+/).filter(function(w){ return HONOR.indexOf(w) < 0; })[0] || '';
      if (!k || key.length < 3) return;
      if (k === key || new RegExp('^' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + NAME_SUF + '$').test(key) ||
          (key.length >= 5 && k.indexOf(key) === 0)) hit = p;
    });
    return hit;
  }

  /* "Eshitganim" matnida topilgan qismlarni rang bilan belgilash */
  function heardHtml(text, hits){
    var R = [];
    function add(ph, cls, suf){ if (!ph) return; var r = rangeOf(text, ph, suf); if (r) R.push([r[0], r[1], cls]); }
    if (hits) {
      add(hits.name, 'h-name', NAME_SUF);
      (hits.sum || []).forEach(function(s){ add(s, 'h-sum'); });
      add(hits.due, 'h-due');
      add(hits.phone, 'h-phone');
    }
    R.sort(function(a, b){ return a[0] - b[0]; });
    var M = [];
    R.forEach(function(r){
      var p = M[M.length - 1];
      if (p && r[0] < p[1]) return;
      if (p && p[2] === r[2] && /^[\s,]*$/.test(text.slice(p[1], r[0]))) { p[1] = r[1]; return; }
      M.push(r.slice());
    });
    M.forEach(function(r){
      if (r[2] !== 'h-sum') return;
      var tail = /^\s*(so'?m|so\u2019m|so\u02bbm|dollar)[a-z\u2019\u02bb']*/i.exec(text.slice(r[1]));
      if (tail) r[1] += tail[0].length;
    });
    var out = '', pos = 0;
    M.forEach(function(r){ out += esc(text.slice(pos, r[0])) + '<mark class="' + r[2] + '">' + esc(text.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
    return out + esc(text.slice(pos));
  }

  /* =========================================================
     5. OVOZ TANISH DVIGATELI
     ========================================================= */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var IS_ANDROID = /Android/i.test(navigator.userAgent || '');
  var ERR = {
    'not-allowed': "Mikrofonga ruxsat berilmadi. Brauzer sozlamalaridan ruxsat bering.",
    'service-not-allowed': "Mikrofonga ruxsat berilmadi. Brauzer sozlamalaridan ruxsat bering.",
    'no-speech': "Ovoz eshitilmadi. Mikrofonni bosib, qaytadan gapiring.",
    'network': "Internet yo'q — ovozni tanish uchun internet kerak.",
    'audio-capture': "Mikrofon topilmadi."
  };

  /* Ikki bo'lakni birlashtiradi: yangisi eskisini o'z ichiga olsa (Android'dagi
     to'planib boruvchi natija) — almashtiradi, aks holda qo'shadi. */
  function mergeSeg(acc, seg){
    acc = String(acc || '').trim(); seg = String(seg || '').trim();
    if (!seg) return acc;
    if (!acc) return seg;
    var a = norm(acc), s = norm(seg);
    if (s.indexOf(a) === 0) return seg;
    if (a.indexOf(s) >= 0) return acc;
    return acc + ' ' + seg;
  }
  /* "ali ali 20 ali 20 ming" → "ali 20 ming" */
  function collapseRepeats(text){
    var w = String(text || '').trim().split(/\s+/).filter(Boolean), changed = true;
    while (changed) {
      changed = false;
      for (var n = Math.min(10, Math.floor(w.length / 2)); n >= 1 && !changed; n--) {
        for (var i = 0; i + 2 * n <= w.length; i++) {
          var same = true;
          for (var k = 0; k < n; k++) if (norm(w[i + k]) !== norm(w[i + n + k])) { same = false; break; }
          if (same) { w.splice(i + n, n); changed = true; break; }
        }
      }
    }
    return w.join(' ');
  }

  /* Ikki tinglash bo'lagini ulaydi: takror bo'lsa qo'shmaydi */
  function joinSeg(a, b){
    a = String(a || '').trim(); b = String(b || '').trim();
    if (!a) return b;
    if (!b) return a;
    var na = norm(a), nb = norm(b);
    if (na.length >= nb.length && na.slice(-nb.length) === nb) return a;
    if (nb.indexOf(na) === 0) return b;
    return a + ' ' + b;
  }

  /* Telefonda brauzer mikrofonni faqat tugma bosilganda yoqishga ruxsat beradi —
     shuning uchun u yerda tinglash to'xtasa, PAUZA bo'ladi va "Davom etish"
     tugmasi chiqadi. Kompyuterda o'zi qayta ulanadi, bo'lmasa pauzaga o'tadi. */
  var TOUCH = IS_ANDROID || /iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
    !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var AUTO_RESTART = !TOUCH;

  var V = (function(){
    var rec = null, h = null, seq = 0, tick = null, simT = null, endT = null, reT = null;
    var done = '', fin = '', inter = '', wantStop = false, startedAt = 0, quickEnds = 0, live = false, paused = false;
    var elapsed = 0, segAt = 0;   /* to'plangan vaqt va joriy bo'lak boshi — taymer davom etadi */

    function text(){ return collapseRepeats(joinSeg(done, mergeSeg(fin, inter))); }
    function secs(){ return Math.floor((elapsed + (paused ? 0 : Date.now() - segAt)) / 1000); }
    function clear(){ clearInterval(tick); clearTimeout(simT); clearTimeout(endT); clearTimeout(reT); }
    function runTick(sid){
      clearInterval(tick);
      tick = setInterval(function(){ if (sid === seq && h && !paused && h.onTick) h.onTick(secs()); }, 250);
    }

    /* handlers.prefix / handlers.offset — avvalgi matn va vaqtdan davom ettirish uchun */
    function start(handlers){
      cancel();
      var sid = ++seq;
      h = handlers; done = String(handlers.prefix || '').trim(); fin = ''; inter = '';
      wantStop = false; quickEnds = 0; paused = false; live = false;
      elapsed = (handlers.offset || 0) * 1000; segAt = Date.now();
      runTick(sid);
      if (h.onTick) h.onTick(secs());
      if (SR && listen(sid)) return;
      simulate(sid, handlers.demo || '');
    }

    /* "Davom etish" — o'sha sessiya, matn va taymer saqlangan holda */
    function resume(){
      if (!h || !paused) return;
      var sid = seq;
      paused = false; wantStop = false; quickEnds = 0; segAt = Date.now();
      runTick(sid);
      if (h.onResume) h.onResume();
      if (SR) { if (!listen(sid)) pause(); return; }
      simulate(sid, h.demoMore || "va yana bir quti choy");
    }

    function pause(){
      if (!h || paused) return;
      done = joinSeg(done, mergeSeg(fin, inter)); fin = ''; inter = '';
      paused = true; live = false; rec = null;
      elapsed += Date.now() - segAt;
      clearInterval(tick); clearTimeout(reT); clearTimeout(simT);
      if (h.onPause) h.onPause(text(), secs());
    }

    function listen(sid){
      var r;
      try { r = new SR(); } catch (e) { return false; }
      rec = r;
      r.lang = db.settings.lang || 'uz-UZ';
      /* Android'da continuous rejim har so'zda butun gapni qayta yuboradi */
      r.continuous = !IS_ANDROID;
      r.interimResults = true;
      r.onresult = function(ev){
        if (sid !== seq || !h || rec !== r) return;
        var f = '', it = '';
        for (var i = 0; i < ev.results.length; i++) {
          var sg = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) f = mergeSeg(f, sg); else it = mergeSeg(it, sg);
        }
        fin = f; inter = it; quickEnds = 0;
        if (h.onInterim) h.onInterim(text());
      };
      r.onerror = function(ev){
        if (sid !== seq || !h || rec !== r) return;
        var code = ev && ev.error;
        /* jimlik, uzilish, tarmoq — onend hal qiladi (pauza yoki qayta ulanish) */
        if (code === 'aborted' || code === 'no-speech' || code === 'network') return;
        fail(code);
      };
      r.onend = function(){
        if (sid !== seq || rec !== r) return;
        live = false;
        done = joinSeg(done, mergeSeg(fin, inter)); fin = ''; inter = '';
        if (!h) return;
        if (wantStop) { deliver(); return; }
        if (!AUTO_RESTART) { pause(); return; }
        quickEnds = (Date.now() - startedAt < 1200) ? quickEnds + 1 : 0;
        if (quickEnds >= 4) { pause(); return; }
        reT = setTimeout(function(){
          if (sid !== seq || !h || wantStop || paused) return;
          if (!listen(sid)) pause();
        }, 150 * (1 + quickEnds));
      };
      try { r.start(); startedAt = Date.now(); live = true; } catch (e) { rec = null; return false; }
      return true;
    }

    function fail(code){
      var hh = h, r = rec;
      done = joinSeg(done, mergeSeg(fin, inter)); fin = ''; inter = '';
      var t = text().trim(), s = secs();
      h = null; rec = null; seq++; clear(); paused = false; live = false;
      if (r) { try { r.abort(); } catch (e) {} }
      if (!hh) return;
      if (t) { hh.onDone(t, s); return; }   /* matnni yo'qotmaymiz */
      if (hh.onError) hh.onError(ERR[code] || "Ovozni tanish to'xtab qoldi. Qayta urinib ko'ring.");
    }

    /* brauzer ovozni tanimasa — oqimni ko'rsatish uchun namuna gap;
       telefonda gap tugagach pauza ham ko'rsatiladi */
    function simulate(sid, full){
      var words = full.split(' '), i = 0;
      (function step(){
        if (sid !== seq || !h || paused) return;
        i += 1; inter = words.slice(0, i).join(' ');
        if (h.onInterim) h.onInterim(text());
        if (i < words.length) simT = setTimeout(step, 105 + Math.random() * 90);
        else if (!AUTO_RESTART) simT = setTimeout(function(){ if (sid === seq) pause(); }, 900);
      })();
    }

    /* foydalanuvchi to'xtatdi: oxirgi so'zlar yetib kelishini kutamiz */
    function stop(){
      if (!h) return;
      wantStop = true;
      clearTimeout(reT);
      if (rec && live) {
        try { rec.stop(); } catch (e) { deliver(); return; }
        clearTimeout(endT);
        endT = setTimeout(deliver, 1600);
      } else deliver();
    }
    function deliver(){
      if (!h) return;
      if (!paused) elapsed += Date.now() - segAt;
      paused = true;   /* secs() endi to'plangan vaqtni qaytaradi */
      done = joinSeg(done, mergeSeg(fin, inter)); fin = ''; inter = '';
      var hh = h, t = text().trim(), s = secs(), r = rec;
      h = null; rec = null; seq++; clear(); paused = false; live = false;
      if (r) { try { r.abort(); } catch (e) {} }
      hh.onDone(t, s);
    }
    function cancel(){
      var hh = h, r = rec;
      h = null; rec = null; seq++; clear(); paused = false; live = false;
      if (r) { try { r.abort(); } catch (e) {} }
      if (hh && hh.onCancel) hh.onCancel();
    }
    return { start:start, resume:resume, stop:stop, cancel:cancel,
      active:function(){ return !!h; }, paused:function(){ return !!h && paused; } };
  })();

  /* =========================================================
     6. QATLAMLAR VA "ORQAGA" TUGMASI
     Har bir ochilgan oyna tarixga yoziladi — telefondagi "orqaga"
     tugmasi saytdan chiqib ketmaydi, oxirgi oynani yopadi.
     ========================================================= */
  var stack = [];
  function setOpen(id, on){
    if (id === 'detail') {
      var dEl = $('#detail');
      dEl.classList.toggle('open', on);
      dEl.setAttribute('aria-hidden', on ? 'false' : 'true');
      return;
    }
    var el = $('#' + id);
    el.classList.toggle('open', on);
    el.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (on) el.style.zIndex = 60 + stack.length * 2;
    if (!on) {
      V.cancel();
      if (id === 'lyVoice') bars.stop();
    }
  }
  function syncBackdrop(){
    var top = null;
    for (var i = stack.length - 1; i >= 0; i--) if (stack[i] !== 'detail') { top = stack[i]; break; }
    var b = $('#backdrop');
    b.classList.toggle('on', !!top);
    if (top) b.style.zIndex = parseInt($('#' + top).style.zIndex, 10) - 1;
  }
  function show(id){
    if (stack.indexOf(id) >= 0) return;
    stack.push(id);
    setOpen(id, true);
    syncBackdrop();
    try { history.pushState({ qd:stack.length }, ''); } catch (e) {}
  }
  function swap(from, to){
    var i = stack.indexOf(from);
    if (i < 0) { show(to); return; }
    setOpen(from, false);
    stack[i] = to;
    setOpen(to, true);
    if (to !== 'detail') $('#' + to).style.zIndex = 60 + (i + 1) * 2;
    syncBackdrop();
  }
  function back(n){
    n = Math.min(n || 1, stack.length);
    if (!n) return;
    try { history.go(-n); } catch (e) { closeTo(stack.length - n); }
  }
  function closeTo(depth){
    while (stack.length > depth) setOpen(stack.pop(), false);
    syncBackdrop();
  }
  window.addEventListener('popstate', function(e){ closeTo((e.state && e.state.qd) || 0); });
  try { history.replaceState({ qd:0 }, ''); } catch (e) {}

  var DEMO = [
    "Behruz ikki qop un oldi, bir million ikki yuz ming so'm. O'n beshinchi oktyabrda beraman dedi. Telefoni to'qson bir, uch yuz o'n ikki, qirq besh, oltmish yetti",

  var demoIx = 0;
  var LEAD = "Qarzni ovoz orqali kiriting. Mikrofonni bosing va ayting.";

  var bars = (function(){
    var el = null, n = 40, hts = [], raf = null, energy = 0, last = 0;
    function build(){
      el = $('#vcBars'); var s = '';
      for (var i = 0; i < n; i++) { s += '<i></i>'; hts.push(0.1); }
      el.innerHTML = s;
    }
    function frame(ts){
      raf = requestAnimationFrame(frame);
      if (ts - last < 70) return;
      last = ts; energy *= 0.86;
      var v = Math.min(1, 0.08 + Math.random() * 0.14 + energy * (0.45 + Math.random() * 0.55));
      hts.shift(); hts.push(v);
      var kids = el.children;
      for (var i = 0; i < n; i++) kids[i].style.height = (4 + hts[i] * 32) + 'px';
    }
    return {
      start:function(){ if (!el) build(); if (!raf) raf = requestAnimationFrame(frame); },
      stop:function(){ if (raf) cancelAnimationFrame(raf); raf = null; },
      kick:function(){ energy = Math.min(1.5, energy + 0.9); }
    };
  })();

  var REC_SUB = "Kim, nima oldi, qancha va qachon qaytaradi. Tugatgach, Yuborish'ni bosing.";
  function vcState(s, msg){
    $('#vc').setAttribute('data-state', s);
    if (s === 'idle') { var l = $('#vcLead'); l.textContent = msg || LEAD; l.classList.toggle('err', !!msg); }
    if (s === 'rec') { $('#vcTitle').textContent = 'Gapiring — tinglayapman'; $('#vcSub').textContent = REC_SUB; }
    if (s === 'rec') bars.start(); else bars.stop();

  function vcStart(){
    vcState('rec');

    var lastLen = 0;
    V.start({
      demo: DEMO[demoIx++ % DEMO.length],

      onPause: function(t, s){

        $('#vcTime').textContent = mmss(s);
        $('#vcLive').textContent = t;
        $('#vcTitle').textContent = t ? "Tinglash to'xtadi" : 'Ovoz eshitilmadi';

                                    : 'Davom etish tugmasini bosib, gapiring.';

      onResume: function(){ vcState('rec'); },
      onDone: function(t, s){
        if (!t) { vcState('idle', "Ovoz eshitilmadi. Mikrofonni bosib, qaytadan gapiring."); return; }
        vcState('busy');
        $('#vcHeard').textContent = t;
        setTimeout(function(){ if (stack.indexOf('lyVoice') >= 0) routeVoice(t, s); }, 450);
      },
      onError: function(m){ vcState('idle', m); },
      onCancel: function(){ bars.stop(); }

  function routeVoice(t, secs){
    var p = parseVoice(t);
    if (p.intent === 'query') {
      var c = p.person || findClient(p.name);
      if (!c) { vcState('idle', '“' + (p.name || t) + '” topilmadi. Qarz yozish uchun summasini ham ayting.'); return; }
      ui.sel = c.id;
      renderList(); renderDetail();
      if (isDesk() || stack.indexOf('detail') >= 0) back();
      else swap('lyVoice', 'detail');
      return;
    }
    if (p.intent === 'pay') {
      var pc = p.person || findClient(p.name);
      if (!pc) { vcState('idle', '“' + (p.name || '?') + '” ro\'yxatda yo\'q. To\'lov uchun avval qarz yozilgan bo\'lishi kerak.'); return; }
      openPay(pc.id, { sum:p.sum, cur:p.cur, note:payNote(t, p.hits.sum.concat(p.hits.name ? [p.hits.name] : [])), heard:t, sec:secs, hits:p.hits, src:'voice' }, 'lyVoice');
      return;
    }
    if (p.intent === 'debt') {
      var dc = p.person || null;
      openDebt({
        src:'voice', heard:t, sec:secs, hits:p.hits, clientId: dc ? dc.id : null,
        name: dc ? dc.name : p.name, phone: p.phone || '', sum:p.sum, cur:p.cur, due:p.due, note:p.items,
        warn: p.sumOver ? 'over' : (p.sumWeak ? 'weak' : ''),
        ai:{ name:!!p.name, phone:!!p.phone, sum:!!p.sum, due:!!p.due, note:!!p.items }
      }, 'lyVoice');
      return;
    }
    vcState('idle', "Tushunmadim. Ism va summani ayting: “Sardor 200 ming so'mga un oldi”");
  }

  /* ism mavjud mijozga to'liq mos kelsa — avtomatik bog'lanadi */
  function autoBind(){
    var n = $('#fName');
    if (!n || F.clientId) return;
    var c = findClient(n.value, F.kind);
    if (c && norm(c.name) === norm(n.value)) bind(c);

  function bind(c){
    F.clientId = c.id;
    var n = $('#fName'), ph = $('#fPhone'), ad = $('#fAddr');
    if (n) n.value = c.name;
    if (ph && !ph.value && c.phone) ph.value = c.phone;
    if (ad && !ad.value && c.address) ad.value = c.address;
    var s = $('#fSug'); if (s) s.innerHTML = '';

  function renderMatch(){
    var box = $('#fMatch');
    var c = F.clientId ? byId(F.clientId) : null;
    if (!c || F.lock) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="match">' + avatar(null, 'sm') +
      '<div class="t"><b>' + esc(c.name) + '</b><span>Mavjud · qarzi ' + esc(plainBal(c)) + '. Yangi qarz shunga qo\'shiladi.</span></div>' +
      '<button type="button" data-act="f-unbind">Boshqa odam</button></div>';
  }
  function suggest(){
    var n = $('#fName'), box = $('#fSug');
    if (!n || !box) return;
    var q = norm(n.value);
    if (q.length < 2 || F.clientId) { box.innerHTML = ''; return; }
    var m = clientsOf(F.kind).filter(function(c){ return norm(c.name).indexOf(q) >= 0 && norm(c.name) !== q; }).slice(0, 3);
    box.innerHTML = m.map(function(c){
      return '<button type="button" data-act="f-pick" data-id="' + c.id + '">' + esc(c.name) + ' <span>' + esc(plainBal(c)) + '</span></button>';
    }).join('');
  }

  function bindForm(){
    var n = $('#fName');
    if (n) n.addEventListener('input', function(){
      if (F.clientId) { var c = byId(F.clientId); if (!c || norm(c.name) !== norm(n.value)) { F.clientId = null; renderMatch(); } }
      suggest();
    });
    if (n) n.addEventListener('blur', function(){ setTimeout(autoBind, 150); });
    sumInput('#fSum');

    due.addEventListener('change', function(){ $$('#fDueQ .chip').forEach(function(x){ x.classList.remove('on'); }); });

  function sumInput(sel){
    var s = $(sel);
    if (!s) return;
    s.addEventListener('input', function(){
      var v = digits(s.value);
      s.value = v ? fmt(v) : '';
      var w = s.closest('.fld'); if (w) w.classList.remove('err');
    });
  }
  function clearAiOnEdit(root){
    $$(root + ' .inp').forEach(function(i){
      i.addEventListener('input', function(){ i.setAttribute('data-user', '1'); var w = i.closest('.fld'); if (w) w.classList.remove('ai', 'err'); });
    });
  }
  function bad(id){
    var w = $('#w_' + id);
    if (w) { w.classList.remove('err'); void w.offsetWidth; w.classList.add('err'); }
    var i = $('#' + id); if (i) i.focus();
  }
  function val(id){ var el = $('#' + id); return el ? el.value.trim() : ''; }

  function saveDebt(){
    var name = F.lock ? '' : val('fName');
    var sum = digits(val('fSum'));
    if (!F.lock && !name) return bad('fName');
    if (!sum) return bad('fSum');

    var s = snap();
    var c = F.clientId ? byId(F.clientId) : null;
    if (!c && !F.lock) {
      c = findClient(name, F.kind);
      if (c && norm(c.name) !== norm(name)) c = null;
    }
    if (!c) {
      c = { id:uid('c'), kind:F.kind, name:cap(name), phone:'', address:'', note:'', recs:[] };
      db.clients.push(c);
    }
    if (!F.lock) {
      var ph = val('fPhone'), ad = val('fAddr');
      if (ph) { var pp = parsePhone(ph); c.phone = pp ? pp.value : ph; }
      if (ad) c.address = ad;
    }
    var dueStr = val('fDue');
    c.recs.push({ id:uid('r'), type:'debt', sum:sum, cur:F.cur, at:Date.now(), due:dueStr ? fromISO(dueStr) : null, note:val('fNote') || null, src:F.src });
    save();
    done(c, (F.kind === 'supplier' ? 'Yozildi: ' : 'Qarz yozildi: ') + c.name + ' · ' + money(sum, F.cur), s);
  }

  function done(c, msg, s){
    back();
    ui.tab = c.kind;
    syncTabs();
    if (isDesk()) ui.sel = c.id;
    renderAll();
    flash(c.id);
    toast(msg, s);
  }

          '<button type="button" class="mic-in" data-act="dictate" data-v="pNote" aria-label="Ovoz bilan yozish">' + IC.mic + '</button></div>', !!pre.note && pre.src === 'voice') +

        '<button class="btn btn-dark" data-act="p-save">' + IC.check + ' To\'lovni saqlash</button>' +
      '</footer>';

    sumInput('#pSum');

    payLeft();

  function payLeft(){
    var c = byId(P.id), owed = bal(c)[P.cur], sum = digits(val('pSum')), h = $('#pLeft');
    h.className = 'hint';
    if (owed <= 0) { h.innerHTML = 'Bu valyutada qarz yo\'q — to\'lov avans bo\'lib yoziladi.'; h.className = 'hint warn'; return; }
    if (!sum) { h.innerHTML = 'Qarzi: <b>' + money(owed, P.cur) + '</b>'; return; }
    var left = owed - sum;
    if (left > 0) h.innerHTML = 'Qoladi: <b>' + money(left, P.cur) + '</b>';
    else if (left === 0) { h.innerHTML = '<b>Qarz to\'liq yopiladi ✓</b>'; h.className = 'hint ok'; }
    else { h.innerHTML = 'Ortiqcha: <b>' + money(-left, P.cur) + '</b> — avans bo\'ladi'; h.className = 'hint warn'; }
  }
  function savePay(){
    var sum = digits(val('pSum'));
    if (!sum) return bad('pSum');
    var c = byId(P.id), s = snap(), at = Date.now();
    if (P.date === 'yest') at -= DAY;
    if (P.date === 'other' && val('pDate')) at = fromISO(val('pDate')) + 12 * 3600000;
    c.recs.push({ id:uid('r'), type:'pay', sum:sum, cur:P.cur, at:at, due:null, note:val('pNote') || null, src:P.src });
    save();
    done(c, (c.kind === 'supplier' ? "To'landi: " : "To'lov: ") + c.name + ' · ' + money(sum, P.cur), s);
  }

  /* =========================================================
     13. FORMA ICHIDA OVOZ ("Gapirib to'ldirish" va izoh mikrofoni)
     ========================================================= */
  /* har bir forma uchun yig'ilgan ovoz matni va vaqti — "Davom etish" shundan davom etadi */
  var FV = { heard:{ f:'', p:'' }, sec:{ f:0, p:0 } };
  function voiceLabel(kind){ return FV.heard[kind] ? 'Davom etish' : "Gapirib to'ldirish"; }

  /* mode: 'idle' | 'live' | 'pause' */
  function btnRec(btn, mode, label, kind){
    if (!btn) return;
    btn.classList.toggle('rec', mode === 'live');
    btn.classList.toggle('paused', mode === 'pause');
    var sp = btn.querySelector('span');
    if (sp) sp.textContent = label || voiceLabel(kind);
  }
  function formVoice(kind){
    var btn = $(kind === 'f' ? '#fVoiceBtn' : '#pVoiceBtn');
    var box = $(kind === 'f' ? '#fHeard' : '#pHeard');
    if (V.active() && (btn.classList.contains('rec') || btn.classList.contains('paused'))) {
      if (V.paused()) V.resume(); else V.stop();
      return;
    }
    function apply(t){ if (kind === 'f') fillDebt(t, box); else fillPay(t, box); }
    btnRec(btn, 'live', "To'xtatish · " + mmss(FV.sec[kind]), kind);
    box.innerHTML = heardBox(FV.heard[kind], null, true);
    V.start({
      prefix: FV.heard[kind], offset: FV.sec[kind],
      demo: kind === 'f' ? "500 ming so'mga 2 qop un oldi, ertaga beradi" : "300 ming so'm, naqd",
      onInterim: function(t){ box.innerHTML = heardBox(t, null, true); },
      onTick: function(s){ btnRec(btn, 'live', "To'xtatish · " + mmss(s), kind); },
      /* telefonda tinglash o'zi to'xtadi: hozirgacha aytilgani maydonlarga tushadi */
      onPause: function(t, s){
        if (t) apply(t);
        btnRec(btn, 'pause', 'Davom etish · ' + mmss(s), kind);
      },
      onResume: function(){ var p = box.querySelector('p'); box.innerHTML = heardBox(p ? p.textContent : '', null, true); },
      onDone: function(t, s){
        FV.heard[kind] = t; FV.sec[kind] = s;
        btnRec(btn, 'idle', null, kind);
        if (!t) { box.innerHTML = ''; toast('Ovoz eshitilmadi'); return; }
        apply(t);
      },
      onError: function(m){ btnRec(btn, 'idle', null, kind); box.innerHTML = FV.heard[kind] ? heardBox(FV.heard[kind]) : ''; toast(m); },
      onCancel: function(){ btnRec(btn, 'idle', null, kind); }
    });
  }
  /* foydalanuvchi qo'lda o'zgartirgan maydonni ovoz ustidan yozmaydi */
  function setField(id, v, ai){
    var el = $('#' + id);
    if (!el || v == null || v === '') return;
    if (el.getAttribute('data-user') === '1' && el.value) return;
    el.value = v;
    var w = $('#w_' + id);
    if (w) { w.classList.remove('err'); w.classList.toggle('ai', !!ai); }
  }
  function fillDebt(t, box){
    var p = parseVoice(t);
    box.innerHTML = heardBox(t, p.hits);
    if (!F.lock && p.name) {
      setField('fName', p.name, true);
      if (p.person) bind(p.person); else { F.clientId = null; renderMatch(); autoBind(); }
    }
    if (p.sum) { setField('fSum', fmt(p.sum), true); setCur('f', p.cur); }
    if (p.due) setField('fDue', toISO(p.due), true);
    if (p.phone) setField('fPhone', p.phone, true);
    if (p.items) setField('fNote', p.items, true);
  }
  function fillPay(t, box){
    var s = parseSum(t);
    box.innerHTML = heardBox(t, { sum:s ? s.phrases : [] });
    if (s) { setField('pSum', fmt(s.value), true); if ($('#lyPay .cur')) setCur('p', s.cur); }
    var note = payNote(t, s ? s.phrases : []);
    if (note) setField('pNote', note, true);
    payLeft();
  }
  function setCur(kind, cur){
    if (kind === 'f') F.cur = cur; else P.cur = cur;
    $$('#' + (kind === 'f' ? 'lyForm' : 'lyPay') + ' .cur button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === cur); });
  }

  /* izoh maydoniga ovoz bilan yozish: matn oxiriga qo'shiladi */
  function dictate(id, btn){
    var ta = $('#' + id);
    if (V.active() && btn.classList.contains('rec')) { V.stop(); return; }
    var base = ta.value.replace(/\s+$/, '');
    btn.classList.add('rec');
    V.start({
      demo: id === 'pNote' ? 'Naqd pul bilan' : 'Un, 2 qop',
      onInterim: function(t){ ta.value = (base ? base + ' ' : '') + t; },
      /* izoh mikrofoni: pauza = tayyor; yana bosilsa matn oxiriga qo'shiladi */
      onPause: function(){ V.stop(); },
      onDone: function(t){ btn.classList.remove('rec'); ta.value = t ? (base ? base + ' ' : '') + (base ? t : cap(t)) : base; },
      onError: function(m){ btn.classList.remove('rec'); ta.value = base; toast(m); },
      onCancel: function(){ btn.classList.remove('rec'); }
    });
  }
